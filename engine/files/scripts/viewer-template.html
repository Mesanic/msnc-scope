// ---------------------------------------------------------------- render
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0; let H = 0; let dpr = 1;

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const stage = document.getElementById('stage');
  // clientWidth can still be 0 on the first frame, before flex layout settles; falling back to
  // the stage and then the window keeps fit() from clamping to minimum zoom on load.
  W = canvas.clientWidth || stage.clientWidth || window.innerWidth - 560;
  H = canvas.clientHeight || stage.clientHeight || window.innerHeight - 50;
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
// The stage narrows when the detail panel opens. Shift the transform by half the delta so the
// world point under the centre stays put instead of the whole graph appearing to jump sideways.
function reflow() {
  const oldW = W; const oldH = H;
  resize();
  if (oldW) { state.tx += (W - oldW) / 2; state.ty += (H - oldH) / 2; }
  draw();
}
window.addEventListener('resize', reflow);
if (window.ResizeObserver) new ResizeObserver(reflow).observe(document.getElementById('stage'));

// Shared-element flight: switching tabs interpolates every node from its force-layout seat
// to its lane seat, so you can watch a node travel to its layer instead of the whole picture
// cutting to a different one.
function X(i) {
  const t = motion.flight;
  if (t >= 1 || !inFlow[i]) return state.view === 'flow' ? flowX[i] : px[i];
  const from = motion.flightFrom === 'flow' ? flowX[i] : px[i];
  const to = state.view === 'flow' ? flowX[i] : px[i];
  return from + (to - from) * t;
}
function Y(i) {
  const t = motion.flight;
  if (t >= 1 || !inFlow[i]) return state.view === 'flow' ? flowY[i] : py[i];
  const from = motion.flightFrom === 'flow' ? flowY[i] : py[i];
  const to = state.view === 'flow' ? flowY[i] : py[i];
  return from + (to - from) * t;
}

// sqrt, not linear and not `w`. Degree runs 0..173 on the reference graph: linear sizing is
// an 87:1 radius ratio and one node eats the screen, while the old `w` put 65% of nodes in
// a 1.3px band. sqrt lands on ~7:1 -- the hub reads as the hub, a leaf is still clickable.
const R_MIN = 3.4;
const R_K = 1.55;
function radius(i) {
  const base = R_MIN + Math.sqrt(deg[i]) * R_K;
  const t = nodes[i].t;
  if (t === 'mod') return Math.max(9, base * 1.15);
  if (t === 'issue') return Math.max(6.5, base);
  return base;
}

// Semantic zoom. Containment depth picks the zoom band a tier fades in over -- modules are
// always up, files arrive as the territory resolves, symbols last. This is purely a render
// and hit-test concern: `visible` still drives the simulation, so zooming never relayouts.
const LOD_BANDS = [[0, 0], [0.30, 0.55], [0.62, 1.05]];
function lodAlpha(i) {
  if (!state.lod || state.view === 'flow') return 1;
  const band = LOD_BANDS[tierOf(i)];
  if (!band[1]) return 1;
  const a = (state.scale - band[0]) / (band[1] - band[0]);
  return a <= 0 ? 0 : a >= 1 ? 1 : a;
}
// What the far view shows instead of the nodes it has faded out.
const lodTier = () => (state.scale < LOD_BANDS[1][1] ? 'module' : state.scale < LOD_BANDS[2][1] ? 'file' : 'symbol');

// ---- geometry -------------------------------------------------------------
// Enclosure, not connection. part-of is 49% of the edge list (1107 of 2258) and as a line it
// says nothing a hull does not say better, so the lines are gone and every file and module is
// drawn as the hull of what it contains. The padding is free: stroking the hull path with a
// fat round-joined line inflates it by half the line width on every side, so there is no
// offset-polygon geometry to get wrong and no blob library to carry.
function convexHull(pts) {
  if (pts.length < 3) return pts;
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const q of p) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

// Corner-cutting through edge midpoints: the hull's straight runs stay, its vertices round
// off. One pass is enough to read as "soft territory" rather than "polygon".
function traceHull(h) {
  ctx.beginPath();
  if (h.length === 1) { ctx.arc(h[0][0], h[0][1], 0.5, 0, Math.PI * 2); return; }
  if (h.length === 2) { ctx.moveTo(h[0][0], h[0][1]); ctx.lineTo(h[1][0], h[1][1]); return; }
  const mx = (a, b) => (a + b) / 2;
  const last = h[h.length - 1];
  ctx.moveTo(mx(last[0], h[0][0]), mx(last[1], h[0][1]));
  for (let i = 0; i < h.length; i++) {
    const cur = h[i];
    const nxt = h[(i + 1) % h.length];
    ctx.quadraticCurveTo(cur[0], cur[1], mx(cur[0], nxt[0]), mx(cur[1], nxt[1]));
  }
  ctx.closePath();
}

function collectPts(g, depthLimit) {
  const out = [];
  const stack = [[g, 0]];
  while (stack.length) {
    const [c, d] = stack.pop();
    // `visible` only -- a node hidden by a filter is genuinely not part of this territory,
    // but one merely faded by zoom still is, and the hull is what represents it.
    if (visible[c]) out.push([X(c), Y(c)]);
    if (d >= depthLimit) continue;
    for (const k of childrenOf[c]) stack.push([k, d + 1]);
  }
  return out;
}

// Territory tint. A muted fixed-saturation hue per module key -- distinguishable enough to
// separate neighbours at 8% alpha, far enough from the saturated node palette that nobody
// reads it as a category.
const hullHue = new Map();
function moduleTint(k) {
  if (!hullHue.has(k)) hullHue.set(k, 'hsl(' + Math.round(hash01(k + '~') * 360) + ', 46%, 56%)');
  return hullHue.get(k);
}

function drawHulls() {
  const zoom = state.scale;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // Files first so a module's tint sits under, not over, the files it holds.
  for (const kind of ['mod', 'file']) {
    for (let i = 0; i < N; i++) {
      if (nodes[i].t !== kind || !childrenOf[i].length) continue;
      const a = lodAlpha(i);
      if (a < 0.04) continue;
      const pts = collectPts(i, kind === 'mod' ? 3 : 1);
      if (pts.length < 2) continue;
      const h = convexHull(pts);
      const pad = (kind === 'mod' ? 26 : 13) + (kind === 'mod' ? 0 : 0);
      const tint = kind === 'mod' ? moduleTint(nodes[i].k) : TYPE_COLOR.file;
      const dim = state.selected !== null && !lit[i] ? 0.45 : 1;
      traceHull(h);
      ctx.strokeStyle = tint;
      ctx.lineWidth = pad * 2;
      ctx.globalAlpha = (kind === 'mod' ? 0.075 : 0.055) * a * dim;
      ctx.stroke();
      ctx.fillStyle = tint;
      ctx.globalAlpha = (kind === 'mod' ? 0.055 : 0.04) * a * dim;
      ctx.fill();
      // A hairline edge keeps the territory from dissolving once several overlap.
      if (kind === 'mod') {
        ctx.globalAlpha = 0.18 * a * dim;
        ctx.lineWidth = 1.2 / zoom;
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}

// Module names ride on their own territory, and only while the module tier is the one you
// are reading -- once symbols resolve, the name would just be another thing in the way.
function drawHullLabels() {
  const zoom = state.scale;
  const fade = 1 - Math.min(1, Math.max(0, (zoom - 0.75) / 0.6));
  if (fade < 0.05) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // Constant on-screen size, so the name of a territory stays as readable zoomed out as in.
  const size = Math.max(11, Math.min(110, 14 / zoom));
  // Biggest territory wins a collision -- a small module losing its name to a large one is
  // the right trade, and two names printed over each other loses both.
  const mods = [];
  for (let i = 0; i < N; i++) {
    if (nodes[i].t !== 'mod' || !childrenOf[i].length || !visible[i]) continue;
    const pts = collectPts(i, 3);
    if (pts.length < 2) continue;
    mods.push([i, pts]);
  }
  mods.sort((a, b) => b[1].length - a[1].length);
  const taken = [];
  for (const [i, pts] of mods) {
    let sx = 0; let sy = 0; let top = Infinity;
    for (const p of pts) { sx += p[0]; sy += p[1]; if (p[1] < top) top = p[1]; }
    const x = sx / pts.length;
    const y = Math.min(sy / pts.length, top + size * 1.4);
    const label = nodes[i].k.slice(nodes[i].k.lastIndexOf('/') + 1) || nodes[i].k;
    ctx.font = '650 ' + size + 'px ui-sans-serif, system-ui';
    const w = ctx.measureText(label).width;
    const box = [x - w / 2, y - size * 0.7, x + w / 2, y + size * 1.7];
    let hit = false;
    for (const t of taken) {
      if (box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1]) { hit = true; break; }
    }
    if (hit) continue;
    taken.push(box);
    ctx.globalAlpha = 0.9 * fade;
    ctx.strokeStyle = cssVar('--bg'); ctx.lineWidth = 4 / zoom; ctx.lineJoin = 'round';
    ctx.strokeText(label, x, y);
    ctx.fillStyle = moduleTint(nodes[i].k);
    ctx.fillText(label, x, y);
    ctx.globalAlpha = 0.55 * fade;
    ctx.font = (size * 0.66) + 'px ui-sans-serif, system-ui';
    ctx.fillStyle = cssVar('--fg2');
    ctx.strokeText(moduleStat(i), x, y + size);
    ctx.fillText(moduleStat(i), x, y + size);
  }
  ctx.globalAlpha = 1;
}

// Zoomed out a module is a container, so it has to carry the numbers you would otherwise
// have to zoom in and count: how much it holds, how much of it is in flight.
const modStatCache = new Map();
function moduleStat(i) {
  if (modStatCache.has(i)) return modStatCache.get(i);
  let files = 0; let syms = 0; let work = 0;
  const stack = [i];
  while (stack.length) {
    const c = stack.pop();
    for (const k of childrenOf[c]) {
      if (nodes[k].t === 'sym') syms++;
      else { files++; if (gitOf[k] && gitOf[k] !== 'pushed') work++; }
      stack.push(k);
    }
  }
  const s = files + ' files · ' + syms + ' symbols' + (work ? ' · ' + work + ' in flight' : '');
  modStatCache.set(i, s);
  return s;
}

// Load choreography: the territory arrives before the things inside it -- the same order
// semantic zoom uses, so the first second of the page teaches the interaction for free.
function settleAlpha(i) {
  if (motion.settle >= 1) return 1;
  const t = motion.settle * 1.55 - tierOf(i) * 0.24;
  return t <= 0 ? 0 : t >= 1 ? 1 : easeOut(t);
}

function nodePath(shape, x, y, r) {
  ctx.beginPath();
  if (shape === 'square') { const s = r * 0.86; ctx.rect(x - s, y - s, s * 2, s * 2); return; }
  if (shape === 'diamond') {
    ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); return;
  }
  if (shape === 'triangle') {
    const s = r * 1.16;
    ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.87, y + s * 0.56); ctx.lineTo(x - s * 0.87, y + s * 0.56);
    ctx.closePath(); return;
  }
  if (shape === 'hexagon') {
    for (let k = 0; k < 6; k++) {
      const a = (Math.PI / 3) * k - Math.PI / 6;
      const vxp = x + Math.cos(a) * r; const vyp = y + Math.sin(a) * r;
      if (k === 0) ctx.moveTo(vxp, vyp); else ctx.lineTo(vxp, vyp);
    }
    ctx.closePath(); return;
  }
  ctx.arc(x, y, r, 0, Math.PI * 2);
}

// ---- ripple ---------------------------------------------------------------
const RIPPLE_HOPS_PER_SEC = 2.6;
// How far the wave has travelled, in hops. Everything nearer is already lit; the node the
// front is passing right now flashes.
function rippleAt(i) {
  if (!state.impact || state.selected === null || hopOf[i] < 0) return { on: 1, pulse: 0 };
  if (motion.ripple === Infinity) return { on: 1, pulse: 0 };
  if (motion.ripple < 0) return { on: 1, pulse: 0 };
  const d = motion.ripple * RIPPLE_HOPS_PER_SEC - hopOf[i];
  if (d < 0) return { on: 0, pulse: 0 };
  return { on: Math.min(1, 0.25 + d * 2), pulse: Math.max(0, 1 - d * 1.4) };
}

// Blast radius, drawn as the thing it is: one ring per hop, sized to enclose everything that
// far out. A flat amber wash could not tell 1 hop from 9; this can, and it labels the count.
function drawHopRings() {
  if (!state.impact || state.selected === null) return;
  const sel = state.selected;
  const far = Math.min(motion.rippleFar, 12);
  if (far < 1) return;
  const cxs = X(sel); const cys = Y(sel);
  const rad = new Float64Array(far + 1);
  const cnt = new Int32Array(far + 1);
  for (let i = 0; i < N; i++) {
    if (lit[i] !== 2 || hopOf[i] < 1 || hopOf[i] > far || !visible[i]) continue;
    cnt[hopOf[i]]++;
    const d = Math.hypot(X(i) - cxs, Y(i) - cys);
    if (d > rad[hopOf[i]]) rad[hopOf[i]] = d;
  }
  for (let h = 2; h <= far; h++) rad[h] = Math.max(rad[h], rad[h - 1]);
  const zoom = state.scale;
  const front = motion.ripple === Infinity ? 99 : motion.ripple * RIPPLE_HOPS_PER_SEC;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  for (let h = 1; h <= far; h++) {
    if (!cnt[h] || rad[h] < 1) continue;
    const rev = Math.min(1, Math.max(0, front - h + 1));
    if (rev <= 0) continue;
    ctx.beginPath(); ctx.arc(cxs, cys, rad[h] + 10, 0, Math.PI * 2);
    ctx.strokeStyle = HOP_COLOR(h);
    ctx.lineWidth = (Math.abs(front - h) < 0.6 ? 2.6 : 1.1) / zoom;
    ctx.globalAlpha = 0.4 * rev;
    ctx.setLineDash([6 / zoom, 5 / zoom]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.85 * rev;
    ctx.font = (11 / zoom) + 'px ui-sans-serif, system-ui';
    ctx.fillStyle = HOP_COLOR(h);
    ctx.fillText(h + ' hop · ' + cnt[h], cxs, cys - rad[h] - 14 / zoom);
  }
  ctx.globalAlpha = 1;
}
// Hop 1 is the thing you will actually break today; hop 9 is trivia. The ramp says so.
function HOP_COLOR(h) {
  const t = Math.min(1, (h - 1) / 5);
  const r = Math.round(240 - t * 70);
  const g = Math.round(120 + t * 40);
  const b = Math.round(40 + t * 130);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(state.tx, state.ty);
  ctx.scale(state.scale, state.scale);

  const dimming = state.search.trim() !== '' || state.selected !== null || state.work;
  const zoom = state.scale;

  if (state.view === 'flow') drawLaneBands();
  else if (state.hulls) drawHulls();
  drawHopRings();

  // edges. Bucketed by kind and by a coarse LOD alpha so a symbol's call lines fade in with
  // the symbols themselves instead of hanging in space above an empty file.
  ctx.lineWidth = 1 / zoom;
  const groups = new Map();
  for (const e of edges) {
    if (!visible[e.a] || !visible[e.b]) continue;
    if (state.view === 'flow' && !FLOW_TYPES.has(e.type)) continue;
    // Containment is the hull now. Its spring still runs -- that is what pulls a file's
    // symbols into a clump -- but the line is gone.
    if (state.view === 'graph' && state.hulls && CONTAIN_TYPES.has(e.type)) continue;
    if (!state.edgeKinds.has(edgeKindOf(e.type))) continue;
    const la = Math.min(lodAlpha(e.a), lodAlpha(e.b));
    if (la < 0.03) continue;
    const hot = state.selected !== null && (lit[e.a] && lit[e.b]);
    const back = state.view === 'flow' && backEdges.has(e.a + '>' + e.b);
    const kind = e.type === 'blocks' ? 'blocks' : back ? 'back' : hot ? 'hot' : edgeKindOf(e.type);
    const bucket = hot || back || kind === 'blocks' ? 4 : Math.max(1, Math.ceil(la * 4));
    const key = kind + '|' + bucket;
    let arr = groups.get(key);
    if (!arr) { arr = []; groups.set(key, arr); }
    arr.push(e);
  }
  const style = {
    // These are the colours the sidebar swatches promise. They used to promise blue and amber
    // while the canvas drew everything the same grey.
    structural: { color: EKIND_COLOR.structural, alpha: dimming ? 0.16 : 0.42, dash: [] },
    editorial: { color: EKIND_COLOR.editorial, alpha: dimming ? 0.12 : 0.3, dash: [3 / zoom, 3 / zoom] },
    hot: { color: cssVar('--edge-hi'), alpha: 0.9, dash: [] },
    blocks: { color: '#e05252', alpha: 0.9, dash: [5 / zoom, 4 / zoom] },
    back: { color: '#e05252', alpha: 0.55, dash: [4 / zoom, 4 / zoom] },
  };
  const order = ['structural', 'editorial', 'back', 'hot', 'blocks'];
  for (const key of [...groups.keys()].sort((a, b) => order.indexOf(a.split('|')[0]) - order.indexOf(b.split('|')[0]))) {
    const arr = groups.get(key);
    const [kind, bucket] = key.split('|');
    const st = style[kind];
    ctx.strokeStyle = st.color;
    ctx.globalAlpha = st.alpha * (Number(bucket) / 4);
    ctx.setLineDash(kind === 'hot' && state.view === 'flow' ? [7 / zoom, 5 / zoom] : st.dash);
    // Marching ants along the selected path: direction you can see rather than infer.
    ctx.lineDashOffset = kind === 'hot' && state.view === 'flow' ? -motion.dash / zoom : 0;
    ctx.lineWidth = (kind === 'hot' ? 1.9 : 1) / zoom;
    ctx.beginPath();
    for (const e of arr) drawEdgePath(e, kind === 'back');
    ctx.stroke();
    if (kind === 'blocks' || kind === 'hot') {
      for (const e of arr) {
        const [, , x2, y2, ax, ay] = edgeEnds(e, kind === 'back');
        arrowHead(ax, ay, x2, y2, st.color, zoom);
      }
    }
  }
  ctx.setLineDash([]); ctx.lineDashOffset = 0; ctx.globalAlpha = 1;

  // A return loop needs to say so. Without the mark, a curve running under the lanes reads as
  // a stray line rather than as the import cycle it is.
  if (state.view === 'flow' && motion.flight >= 1 && zoom > 0.35) {
    ctx.font = (11 / zoom) + 'px ui-sans-serif, system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const e of edges) {
      if (!visible[e.a] || !visible[e.b] || !backEdges.has(e.a + '>' + e.b)) continue;
      if (!FLOW_TYPES.has(e.type)) continue;
      const [x1, y1, x2, y2] = edgeEnds(e, true);
      const dip = flowBottom + 34 + (Math.abs(x1 - x2) % 90) * 0.5;
      const my = (y1 + y2) / 8 + 0.75 * dip;
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = cssVar('--bg'); ctx.lineWidth = 4 / zoom; ctx.lineJoin = 'round';
      ctx.strokeText('↩ cycle', (x1 + x2) / 2, my);
      ctx.fillStyle = '#e05252';
      ctx.fillText('↩ cycle', (x1 + x2) / 2, my);
    }
    ctx.globalAlpha = 1;
  }

  // nodes
  const flowPills = state.view === 'flow' && motion.flight >= 1;
  for (let i = 0; i < N; i++) {
    if (!visible[i]) continue;
    const n = nodes[i];
    const lod = lodAlpha(i);
    const rip = rippleAt(i);
    if (lod < 0.02 || rip.on <= 0) continue;
    const x = X(i); const y = Y(i); const r = radius(i);
    let a = lod * rip.on * settleAlpha(i);
    if (state.search.trim() && !matched[i]) a *= 0.12;
    else if (state.selected !== null && !lit[i]) a *= state.impact || state.view === 'flow' ? 0.1 : 0.22;
    if (state.spotlight && n.t !== state.spotlight) a *= 0.08;
    // A node with no seat in the flow layout fades rather than teleporting to the origin.
    if (!inFlow[i]) a *= state.view === 'flow' ? 1 - motion.flight : motion.flight;
    if (a <= 0.004) continue;
    ctx.globalAlpha = a;

    if (flowPills) { drawFlowPill(i, x, y, a); continue; }

    let fill = TYPE_COLOR[n.t] || '#888';
    const shape = TYPE_SHAPE[n.t] || 'circle';
    if (n.t === 'issue') {
      const iss = issueOf[i];
      fill = iss && iss.state === 'closed' ? '#6b7885' : '#3fb950';
      if (iss && iss.frontier) { ctx.shadowColor = '#3fb950'; ctx.shadowBlur = 16 / zoom; }
      nodePath('hexagon', x, y, r + 1.5); ctx.fillStyle = fill; ctx.fill(); ctx.shadowBlur = 0;
      if (iss && iss.openBlockedBy && iss.openBlockedBy.length) {
        ctx.strokeStyle = '#e05252'; ctx.lineWidth = 2 / zoom; nodePath('hexagon', x, y, r + 4); ctx.stroke();
      }
    } else {
      // In impact mode the colour is the hop count, not a flat amber -- one hop and nine hops
      // used to be the same shade of "affected", which is the whole answer thrown away.
      if (state.impact && lit[i] === 2) {
        ctx.shadowColor = HOP_COLOR(hopOf[i]);
        ctx.shadowBlur = (10 + rip.pulse * 26) / zoom;
        fill = HOP_COLOR(hopOf[i]);
      }
      // Provenance, on the node instead of buried in a facet: solid = both tools saw it,
      // outlined = only one, and the outline is dashed when that one was the symbols engine. Shape and
      // fill, not a fourth colour table nobody can hold in their head.
      const src = n.src;
      nodePath(shape, x, y, r);
      if (src && src !== 'both') {
        ctx.fillStyle = fill; ctx.globalAlpha = a * 0.22; ctx.fill();
        ctx.globalAlpha = a;
        ctx.strokeStyle = fill; ctx.lineWidth = Math.max(1.2, r * 0.28) / 1;
        ctx.setLineDash(src === 'symbols' ? [3 / zoom, 2.4 / zoom] : []);
        ctx.stroke(); ctx.setLineDash([]);
      } else {
        ctx.fillStyle = fill; ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    const g = gitOf[i];
    if (g && GIT_COLOR[g]) {
      ctx.strokeStyle = GIT_COLOR[g];
      ctx.lineWidth = 1.8 / zoom;
      ctx.setLineDash(g === 'untracked' ? [2.5 / zoom, 2.5 / zoom] : []);
      ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.stroke();
      if (g === 'modified') { ctx.beginPath(); ctx.arc(x, y, r + 5.5, 0, Math.PI * 2); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    if (n.st === 'stale') {
      ctx.strokeStyle = cssVar('--warn'); ctx.lineWidth = 1 / zoom;
      ctx.beginPath();
      ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r);
      ctx.moveTo(x - r, y + r); ctx.lineTo(x + r, y - r);
      ctx.stroke();
    }
    if (i === state.selected) {
      ctx.strokeStyle = cssVar('--accent'); ctx.lineWidth = 2.5 / zoom;
      ctx.beginPath(); ctx.arc(x, y, r + 8, 0, Math.PI * 2); ctx.stroke();
    }
    if (seqOf[i] > 0 && state.view === 'flow') {
      ctx.globalAlpha = 1;
      ctx.fillStyle = cssVar('--accent');
      ctx.beginPath(); ctx.arc(x - r - 9, y - r - 5, 7 / Math.max(1, zoom * 0.8), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `${9 / Math.max(1, zoom * 0.8)}px ui-sans-serif, system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(seqOf[i]), x - r - 9, y - r - 5);
    }
  }
  ctx.globalAlpha = 1;

  // Labels, occlusion-aware. Candidates are ranked by degree and each one reserves a box; a
  // label that would land on a box already taken is dropped rather than overprinted, so the
  // hub always keeps its name and the hairball stops printing mush. Halo text over the
  // background colour keeps a name readable where it crosses an edge or a hull.
  if (zoom > 0.3 && !flowPills) {
    const size = 11 / zoom;
    ctx.font = size + 'px ui-sans-serif, system-ui';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const cand = [];
    for (let i = 0; i < N; i++) {
      if (!visible[i] || lodAlpha(i) < 0.5) continue;
      if (nodes[i].t === 'mod' && state.hulls) continue;   // the hull already carries the name
      const important = i === state.selected || i === state.hover || matched[i]
        || nodes[i].t === 'entry' || nodes[i].t === 'issue'
        || (state.impact && hopOf[i] === 1)
        || (deg[i] > 3 && zoom > 0.75);
      if (!important) continue;
      if (state.selected !== null && !lit[i] && !matched[i]) continue;
      if (state.search.trim() && !matched[i]) continue;
      if (state.spotlight && nodes[i].t !== state.spotlight) continue;
      cand.push(i);
    }
    cand.sort((a, b) => (b === state.selected ? 1 : 0) - (a === state.selected ? 1 : 0) || deg[b] - deg[a]);
    const taken = [];
    const pad = 2 / zoom;
    for (const i of cand.slice(0, 320)) {
      const text = labelOf(i);
      const w = ctx.measureText(text).width;
      const x = X(i) + radius(i) + 6 / zoom;
      const y = Y(i);
      const box = [x - pad, y - size * 0.62, x + w + pad, y + size * 0.62];
      let hit = false;
      for (const t of taken) {
        if (box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1]) { hit = true; break; }
      }
      if (hit && i !== state.selected && i !== state.hover) continue;
      taken.push(box);
      ctx.globalAlpha = Math.min(1, lodAlpha(i) * motion.settle);
      ctx.strokeStyle = cssVar('--bg'); ctx.lineWidth = 3.2 / zoom; ctx.lineJoin = 'round';
      ctx.strokeText(text, x, y);
      ctx.fillStyle = i === state.selected ? cssVar('--fg') : cssVar('--fg2');
      ctx.fillText(text, x, y);
    }
    ctx.globalAlpha = 1;
  }
  if (state.hulls && state.view === 'graph') drawHullLabels();
  ctx.restore();
  // Lane headers live in screen space so they cannot collide with the rows they name.
  if (flowPills) drawLaneHeaders();
  drawZoomHint();
}

// ---- flow drawing ---------------------------------------------------------
const PILL_H = 17;
const pillW = new Float32Array(N);
let portOutOf = new Float32Array(1);
let portInOf = new Float32Array(1);
let flowBottom = 0;

// 29 import edges used to converge on one pixel at the centre of server.py, which reads as
// "one thick line" rather than "29 dependents". A pill has a left and a right edge, and each
// edge gets its own slot on it, ordered by where its far end sits.
function edgeEnds(e, back) {
  if (!(state.view === 'flow' && motion.flight >= 1)) {
    return [X(e.a), Y(e.a), X(e.b), Y(e.b), X(e.a), Y(e.a)];
  }
  const span = PILL_H / 2 - 1.5;
  const x1 = X(e.a) + pillW[e.a] / 2;
  const y1 = Y(e.a) + portOutOf[e.ei] * span;
  const x2 = X(e.b) - pillW[e.b] / 2;
  const y2 = Y(e.b) + portInOf[e.ei] * span;
  if (back) return [x1, y1, X(e.b) - pillW[e.b] / 2, y2, x2 - 30, y2 + 20];
  return [x1, y1, x2, y2, (x1 + x2) / 2, y2];
}

function drawEdgePath(e, back) {
  const [x1, y1, x2, y2] = edgeEnds(e, back);
  if (!(state.view === 'flow' && motion.flight >= 1)) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); return; }
  if (back) {
    // A cycle drawn straight back across the layers reads as noise. Drop it under the lanes
    // and bring it home as a return loop, so the shape itself says "this goes backwards".
    const dip = flowBottom + 34 + (Math.abs(x1 - x2) % 90) * 0.5;
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1 + 60, dip, x2 - 60, dip, x2, y2);
    return;
  }
  const mx = (x1 + x2) / 2;
  ctx.moveTo(x1, y1); ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
}

function drawFlowPill(i, x, y, a) {
  const n = nodes[i];
  const w = pillW[i]; const h = PILL_H;
  const zoom = state.scale;
  const base = TYPE_COLOR[n.t] || '#888';
  const hot = state.impact && lit[i] === 2 ? HOP_COLOR(hopOf[i]) : null;
  ctx.beginPath();
  const rr = h / 2;
  ctx.moveTo(x - w / 2 + rr, y - h / 2);
  ctx.arcTo(x + w / 2, y - h / 2, x + w / 2, y + h / 2, rr);
  ctx.arcTo(x + w / 2, y + h / 2, x - w / 2, y + h / 2, rr);
  ctx.arcTo(x - w / 2, y + h / 2, x - w / 2, y - h / 2, rr);
  ctx.arcTo(x - w / 2, y - h / 2, x + w / 2, y - h / 2, rr);
  ctx.closePath();
  ctx.fillStyle = cssVar('--panel2'); ctx.fill();
  ctx.globalAlpha = a * 0.9;
  ctx.fillStyle = (hot || base) + '2e'; ctx.fill();
  ctx.globalAlpha = a;
  ctx.strokeStyle = hot || base;
  ctx.lineWidth = (i === state.selected ? 2.2 : n.src && n.src !== 'both' ? 1 : 1.4) / zoom;
  ctx.setLineDash(n.src === 'symbols' ? [3 / zoom, 2.4 / zoom] : []);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '11px ui-sans-serif, system-ui';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = cssVar('--fg');
  ctx.fillText(labelOf(i), x - w / 2 + 7, y + 0.5);
  if (seqOf[i] > 0) {
    ctx.beginPath(); ctx.arc(x - w / 2 - 7, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = cssVar('--accent'); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '9px ui-sans-serif, system-ui';
    ctx.textAlign = 'center'; ctx.fillText(String(seqOf[i]), x - w / 2 - 7, y + 0.5);
  }
}

// A one-line "you are looking at modules / files / symbols" so the fade reads as a deliberate
// altitude rather than as nodes going missing.
function drawZoomHint() {
  const el = document.getElementById('zoomhint');
  if (!el) return;
  if (state.view !== 'graph' || !state.lod) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = lodTier() === 'module' ? 'modules · zoom in for files'
    : lodTier() === 'file' ? 'files · zoom in for symbols' : 'symbols';
}

function laneLabel(L) {
  if (L === 0) return 'entry points';
  if (L === layerBlocks.length - 1) return 'leaves';
  return 'depth ' + L;
}

// The lane background, plus a block per module inside it. No text sits here any more -- world
// space is where the rows are, and a header drawn in it lands on top of a neighbouring row.
function drawLaneBands() {
  if (!layerBlocks.length) return;
  const zoom = state.scale;
  layerBlocks.forEach((blocks, L) => {
    const x = L * FLOW_COLW;
    let top = Infinity; let bot = -Infinity;
    for (const b of blocks) {
      if (!b.items.some((i) => visible[i])) continue;
      if (b.y0 < top) top = b.y0;
      if (b.y1 > bot) bot = b.y1;
    }
    if (!isFinite(top)) return;
    ctx.fillStyle = L % 2 ? 'rgba(127,140,160,.04)' : 'rgba(127,140,160,.08)';
    ctx.fillRect(x - FLOW_COLW / 2 + 4, top - 16, FLOW_COLW - 8, bot - top + 32);
    ctx.font = Math.min(14, 10 / Math.max(0.6, zoom)) + 'px ui-sans-serif, system-ui';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    for (const b of blocks) {
      const shown = b.items.filter((i) => visible[i]);
      if (!shown.length) continue;
      const left = x - FLOW_COLW / 2 + 10;
      const w = FLOW_COLW - 20;
      ctx.fillStyle = b.key === '\u0000tests' ? 'rgba(224,138,46,.07)' : 'rgba(127,140,160,.07)';
      ctx.fillRect(left, b.y0, w, b.y1 - b.y0);
      ctx.strokeStyle = b.key === '\u0000tests' ? 'rgba(224,138,46,.30)' : cssVar('--line');
      ctx.lineWidth = 1 / zoom;
      ctx.strokeRect(left, b.y0, w, b.y1 - b.y0);
      if (zoom > 0.4) {
        ctx.fillStyle = b.key === '\u0000tests' ? '#e08a2e' : cssVar('--fg3');
        ctx.fillText(b.label + ' · ' + shown.length, left + 1, b.y0 - 2 / zoom);
      }
    }
  });
}

// Lane headers, in screen space. They used to be drawn in world space above the tallest row
// of their own column, which put them squarely on top of the rows of every taller neighbour.
// Pinned to the top of the viewport they scroll sideways with the columns and never collide.
function drawLaneHeaders() {
  if (!layerBlocks.length) return;
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = cssVar('--panel');
  ctx.fillRect(0, 0, W, 28);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = cssVar('--line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 28.5); ctx.lineTo(W, 28.5); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  layerBlocks.forEach((blocks, L) => {
    let shown = 0;
    let tests = 0;
    for (const b of blocks) {
      const s = b.items.filter((i) => visible[i]).length;
      shown += s;
      if (b.key === '\u0000tests') tests += s;
    }
    if (!shown) return;
    const sx = L * FLOW_COLW * state.scale + state.tx;
    if (sx < -110 || sx > W + 110) return;
    ctx.font = '600 11px ui-sans-serif, system-ui';
    ctx.fillStyle = cssVar('--fg2');
    ctx.fillText((L + 1) + ' · ' + laneLabel(L), sx, 11);
    ctx.font = '10px ui-sans-serif, system-ui';
    ctx.fillStyle = cssVar('--fg3');
    ctx.fillText(tests ? (shown - tests) + ' + ' + tests + ' tests' : String(shown), sx, 22);
  });
  ctx.restore();
}

function arrowHead(x1, y1, x2, y2, color, zoom) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const s = 6 / zoom;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(a - 0.4) * s, y2 - Math.sin(a - 0.4) * s);
  ctx.lineTo(x2 - Math.cos(a + 0.4) * s, y2 - Math.sin(a + 0.4) * s);
  ctx.closePath(); ctx.fill();
}

// Five files called skill.py in one column, every one labelled "skill.py", is five identical
// rows. A basename that is not unique in the graph keeps as much of its path as it takes.
const baseCount = new Map();
for (const n of nodes) {
  const b = n.k.slice(n.k.lastIndexOf('/') + 1);
  baseCount.set(b, (baseCount.get(b) || 0) + 1);
}
const labelCache = new Map();
function labelOf(i) {
  if (labelCache.has(i)) return labelCache.get(i);
  const n = nodes[i];
  let out;
  if (n.t === 'issue') out = n.k + ' ' + (n.s || '').slice(0, 32);
  else if (n.t === 'skill' || n.t === 'concept' || n.t === 'note') out = n.k;
  else {
    const cut = n.k.lastIndexOf('/');
    const base = n.k.slice(cut + 1) || n.k;
    if (cut < 0 || (baseCount.get(base) || 0) < 2) out = base;
    else {
      // Walk back up the path until the tail is unique enough to tell them apart.
      const parts = n.k.split('/');
      out = parts.length > 2 ? parts.slice(-3).join('/') : n.k;
      if (out.length > 34) out = '…/' + parts.slice(-2).join('/');
    }
  }
  labelCache.set(i, out);
  return out;
}
const varCache = new Map();
function cssVar(name) {
  if (!varCache.has(name)) varCache.set(name, getComputedStyle(document.documentElement).getPropertyValue(name).trim());
  return varCache.get(name);
}
// Halo text and hull edges are painted with --bg, so a cached palette survives a theme switch
// as text outlined in the colour of the theme you just left.
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme = () => { varCache.clear(); draw(); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}

// ---------------------------------------------------------------- interaction
let dragging = null; let panning = null;

function toWorld(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return [(cx - r.left - state.tx) / state.scale, (cy - r.top - state.ty) / state.scale];
}
function pick(cx, cy) {
  const [wx, wy] = toWorld(cx, cy);
  // In flow the target is the pill, not a point at its centre -- a 200px-wide row that only
  // accepted clicks in the middle 18px was the wrong hit area by an order of magnitude.
  if (state.view === 'flow' && motion.flight >= 1) {
    let best = -1;
    for (let i = 0; i < N; i++) {
      if (!visible[i]) continue;
      if (Math.abs(wx - flowX[i]) <= pillW[i] / 2 + 3 && Math.abs(wy - flowY[i]) <= PILL_H / 2 + 3) best = i;
    }
    return best;
  }
  let best = -1; let bestD = 18 / state.scale;
  for (let i = 0; i < N; i++) {
    // Faded out by semantic zoom means faded out for the mouse too, or you select things you
    // cannot see.
    if (!visible[i] || lodAlpha(i) < 0.35) continue;
    const d = Math.hypot(X(i) - wx, Y(i) - wy);
    if (d < Math.max(bestD, radius(i) + 4)) { bestD = d; best = i; }
  }
  return best;
}

canvas.addEventListener('mousedown', (e) => {
  const i = pick(e.clientX, e.clientY);
  if (i >= 0 && state.view === 'graph') { dragging = i; pinned = i; alpha = Math.max(alpha, 0.3); }
  else panning = [e.clientX - state.tx, e.clientY - state.ty];
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (dragging !== null) {
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    px[dragging] = wx; py[dragging] = wy; vx[dragging] = 0; vy[dragging] = 0;
    draw(); return;
  }
  if (panning) { state.tx = e.clientX - panning[0]; state.ty = e.clientY - panning[1]; draw(); return; }
  const i = pick(e.clientX, e.clientY);
  if (i !== state.hover) { state.hover = i >= 0 ? i : null; draw(); }
  showTip(i, e.clientX, e.clientY);
});
window.addEventListener('mouseup', (e) => {
  if (dragging === null && panning && Math.abs(e.clientX - panning[0] - state.tx) < 3) { /* click on bg */ }
  if (dragging !== null) { pinned = -1; alpha = Math.max(alpha, 0.25); tick(); }
  dragging = null; panning = null;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('click', (e) => {
  const i = pick(e.clientX, e.clientY);
  select(i >= 0 ? i : null);
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left; const my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0016);
  const next = Math.min(4, Math.max(0.08, state.scale * k));
  state.tx = mx - (mx - state.tx) * (next / state.scale);
  state.ty = my - (my - state.ty) * (next / state.scale);
  state.scale = next;
  draw();
}, { passive: false });

function showTip(i, cx, cy) {
  const tip = document.getElementById('tip');
  if (i < 0) { tip.style.display = 'none'; return; }
  const n = nodes[i];
  const g = gitOf[i];
  tip.innerHTML = `<b>${escapeHtml(n.k)}</b><br>${escapeHtml((n.s || '').slice(0, 150))}`
    + (g && g !== 'pushed' ? `<br><span style="color:${GIT_COLOR[g]}">● ${GIT_LABEL[g]}</span>` : '');
  tip.style.display = 'block';
  const r = canvas.getBoundingClientRect();
  tip.style.left = Math.min(cx - r.left + 14, r.width - 340) + 'px';
  tip.style.top = (cy - r.top + 14) + 'px';
}

function select(i) {
  state.selected = i;
  recomputeLit();
  renderDetail();
  writeHash();
  tick();
}

// Deep links. The URL is the state, so "look at this" becomes a link you can paste into a PR
// instead of a sentence describing which four controls to click first.
//
// replaceState throws a SecurityError on an opaque origin -- a data: URL, a sandboxed frame,
// some file:// contexts -- and this viewer is one self-contained file whose whole point is
// being opened locally. A link-sharing convenience must never be able to break selection, so
// the first failure disables the feature and everything else carries on.
let hashOk = true;
function writeHash() {
  if (!hashOk) return;
  const p = [];
  if (state.view !== 'graph') p.push('v=' + state.view);
  if (state.selected !== null) p.push('n=' + encodeURIComponent(nodes[state.selected].id));
  if (state.impact) p.push('impact=1');
  if (state.work) p.push('work=1');
  if (state.search.trim()) p.push('q=' + encodeURIComponent(state.search.trim()));
  if (state.types.size !== ALL_TYPES.size) p.push('t=' + [...state.types].join(','));
  const h = p.join('&');
  if (h === location.hash.slice(1)) return;
  try {
    history.replaceState(null, '', h ? '#' + h : location.pathname);
  } catch (err) {
    hashOk = false;
  }
}

function applyHash() {
  let h;
  try { h = new URLSearchParams(location.hash.slice(1)); } catch (err) { return false; }
  if (h.get('t')) state.types = new Set(h.get('t').split(',').filter(Boolean));
  if (h.get('q')) { state.search = h.get('q'); document.getElementById('search').value = state.search; }
  if (h.get('work') === '1') { state.work = true; document.getElementById('preset-work').setAttribute('aria-pressed', 'true'); }
  if (h.get('impact') === '1') { state.impact = true; document.getElementById('preset-impact').setAttribute('aria-pressed', 'true'); }
  const target = h.get('n') !== null ? idx.get(h.get('n')) : undefined;
  if (h.get('t') || h.get('q') || h.get('work') === '1') { buildControls(); recomputeVisible(); }
  if (h.get('v') === 'flow') setView('flow');
  if (target !== undefined) { select(target); centerOn(target); }
  return target !== undefined || h.get('v') === 'flow';
}

// ---------------------------------------------------------------- detail panel
function renderDetail() {
  const el = document.getElementById('detail');
  if (state.selected === null) { el.classList.remove('open'); el.innerHTML = ''; return; }
  el.classList.add('open');
  const i = state.selected;
  const n = nodes[i];
  const g = gitOf[i];
  const iss = issueOf[i];
  const parts = [];

  parts.push(`<button class="close" id="detail-close">×</button>`);
  parts.push(`<div class="key">${escapeHtml(n.k)}</div>`);
  parts.push(`<div class="meta">
    <span class="badge" style="background:${TYPE_COLOR[n.t]}22;color:${TYPE_COLOR[n.t]}">${TYPE_LABEL[n.t] || n.t}</span>
    <code>${n.id}</code>${n.by === 'agent' ? ' · agent-written' : ''}</div>`);
  parts.push(`<div class="sum">${escapeHtml(n.s || 'No summary yet.')}</div>`);

  const facts = [];
  if (g) facts.push(`<span style="color:${GIT_COLOR[g] || 'var(--ok)'}">●</span> ${GIT_LABEL[g]}`);
  if (n.st === 'stale') facts.push('<span style="color:var(--warn)">⚠ stale — summary predates the current file</span>');
  if (layerOf[i] >= 0 && inFlow[i]) facts.push(`flow depth ${layerOf[i]}`);
  // These were flow-graph counts, and the flow graph has no symbols in it -- so the panel
  // read "0 importers" next to a canvas lighting up 43 callers. Same graph as impact mode now.
  facts.push(`${impIn[i].length} direct ${plural(impIn[i].length, 'dependent', 'dependents')} · ${impOut[i].length} direct ${plural(impOut[i].length, 'dependency', 'dependencies')}`);
  if (n.g && n.g.length) facts.push('tags: ' + n.g.map(escapeHtml).join(', '));
  parts.push(`<h4>Facts</h4>${facts.map((f) => `<div style="font-size:12px;color:var(--fg2)">${f}</div>`).join('')}`);

  if (impIn[i].length || impOut[i].length) {
    const up = walk(i, impIn); const down = walk(i, impOut);
    parts.push('<h4>Blast radius</h4>');
    parts.push(`<div style="font-size:12px;color:var(--fg2)">
      <b style="color:var(--warn)">${up.length}</b> ${plural(up.length, 'thing breaks', 'things break')} if this changes ·
      relies on <b>${down.length}</b></div>`);
    if (state.selected === i && !state.impact) {
      parts.push('<button class="btn" style="margin-top:6px" id="show-impact">Show the ripple</button>');
    }
  }

  if (iss) {
    parts.push('<h4>Issue</h4>');
    parts.push(`<div style="font-size:12px">state: <b>${iss.state}</b>${iss.frontier ? ' · <span style="color:var(--ok)">ready to pick up</span>' : ''}</div>`);
    if (iss.openBlockedBy && iss.openBlockedBy.length) {
      parts.push(`<div style="font-size:12px;color:var(--danger)">blocked by ${iss.openBlockedBy.map((b) => '#' + b).join(', ')}</div>`);
    }
    if (iss.assignees && iss.assignees.length) parts.push(`<div style="font-size:12px;color:var(--fg2)">assigned: ${iss.assignees.map(escapeHtml).join(', ')}</div>`);
    if (iss.url) parts.push(`<a class="node" href="${escapeHtml(iss.url)}" target="_blank" rel="noopener">open on GitHub ↗</a>`);
  }

  const byType = new Map();
  const add = (t, j, dir) => {
    const key = t + (dir === 'in' ? ' ←' : ' →');
    if (!byType.has(key)) byType.set(key, []);
    byType.get(key).push(j);
  };
  for (const ei of outAdj[i]) add(edges[ei].type, edges[ei].b, 'out');
  for (const ei of inAdj[i]) add(edges[ei].type, edges[ei].a, 'in');
  if (byType.size) {
    parts.push('<h4>Connections</h4>');
    for (const [key, list] of [...byType].sort()) {
      parts.push(`<div style="color:var(--fg3);font-size:11px;margin-top:6px">${escapeHtml(key)} (${list.length})</div>`);
      for (const j of list.slice(0, 12)) {
        parts.push(`<a class="node" data-goto="${j}">${escapeHtml(nodes[j].k)}</a>`);
      }
      if (list.length > 12) parts.push(`<div style="color:var(--fg3);font-size:11px">+${list.length - 12} more</div>`);
    }
  }

  if (n.a && n.a.length) {
    // File X-ray. The comma list said which symbols exist; the strip says where they sit and
    // how the file is packed -- twelve ticks crowded into the first fifth of a 2400-line file
    // is a different file from twelve spread evenly, and only one of those pictures shows it.
    const declared = Number((String(n.s).match(/(\d+)\s*loc/) || [])[1] || 0);
    const loc = Math.max(declared, ...n.a.map(([, l]) => Number(l) || 0), 1);
    parts.push(`<h4>Symbols · ${n.a.length}</h4>`);
    parts.push('<div class="xray"><div class="xr-bar">'
      + n.a.map(([s, l]) => `<i style="left:${Math.min(99.4, ((Number(l) || 0) / loc) * 100).toFixed(2)}%" title="${escapeHtml(s)} — line ${l}"></i>`).join('')
      + `</div><div class="xr-scale"><span>line 1</span><span>${loc}${declared ? ' loc' : ''}</span></div></div>`);
    parts.push(`<div style="font-size:12px;color:var(--fg2)">${n.a.slice(0, 60).map(([s, l]) => `${escapeHtml(s)}<span style="color:var(--fg3)">:${l}</span>`).join(', ')}${n.a.length > 60 ? ' …' : ''}</div>`);
  }

  const ego = egoSvg(i);
  if (ego) parts.push('<h4>Neighbourhood</h4>' + ego);

  if (n.note) {
    parts.push('<h4>Note</h4>');
    parts.push(`<div style="font-size:12px;color:var(--fg2);border-left:2px solid var(--ok);padding-left:8px">${escapeHtml(n.note)}</div>`);
  }

  parts.push('<h4>Ask the agent</h4>');
  parts.push(`<code id="cmd">scope context ${escapeHtml(n.k)}</code>`);
  parts.push(`<button class="btn" style="margin-top:6px" id="copycmd">Copy command</button>`);

  el.innerHTML = parts.join('');
  el.querySelector('#detail-close').onclick = () => select(null);
  const showImpact = el.querySelector('#show-impact');
  if (showImpact) showImpact.onclick = () => document.getElementById('preset-impact').click();
  el.querySelectorAll('[data-goto]').forEach((a) => {
    a.onclick = () => { const j = Number(a.dataset.goto); select(j); centerOn(j); };
  });
  const copy = el.querySelector('#copycmd');
  if (copy) copy.onclick = () => {
    const text = el.querySelector('#cmd').textContent;
    navigator.clipboard.writeText(text).then(() => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy command'; }, 1200); },
      () => { copy.textContent = text; });
  };
}

// Where a node ends up once any tab flight has landed. fit() has to measure the destination,
// not the frame it is passing through.
const destX = (i) => (state.view === 'flow' ? flowX[i] : px[i]);
const destY = (i) => (state.view === 'flow' ? flowY[i] : py[i]);

// Every camera move is a tween. Jumping the viewport loses the reader: after a cut you have
// to re-find where you were, after a 500ms ease you simply watched yourself travel.
function camTo(tx, ty, scale, ms) {
  if (REDUCED || ms === 0) { state.tx = tx; state.ty = ty; state.scale = scale; draw(); return; }
  motion.cam = { t: 0, ms: ms || 520, fx: state.tx, fy: state.ty, fs: state.scale, tx, ty, ts: scale };
  tick();
}

// The one-hop neighbourhood, drawn rather than listed. The Connections list below answers
// "what is attached"; this answers "what shape is this node in" at a glance -- a spoke of
// twelve callers reads instantly as a hub, where twelve list rows read as twelve list rows.
function egoSvg(i) {
  const seen = new Set([i]);
  const nb = [];
  for (const ei of [...inAdj[i], ...outAdj[i]]) {
    const e = edges[ei];
    const j = e.a === i ? e.b : e.a;
    if (seen.has(j)) continue;
    seen.add(j);
    nb.push([j, edgeKindOf(e.type)]);
  }
  if (!nb.length) return '';
  nb.sort((a, b) => deg[b[0]] - deg[a[0]]);
  const show = nb.slice(0, 8);
  const VW = 300; const VH = 150; const cx = VW / 2; const cy = VH / 2;
  const out = [];
  show.forEach(([j, kind], k) => {
    const ang = (k / show.length) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(ang) * 104;
    const y = cy + Math.sin(ang) * 50;
    out.push(`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${EKIND_COLOR[kind]}" stroke-width="1" opacity=".6"/>`);
    out.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3 + Math.sqrt(deg[j]) * 0.7).toFixed(1)}" fill="${TYPE_COLOR[nodes[j].t] || '#888'}"/>`);
    const above = y < cy;
    out.push(`<text x="${x.toFixed(1)}" y="${(y + (above ? -9 : 14)).toFixed(1)}" text-anchor="middle">${escapeHtml(labelOf(j).slice(0, 18))}</text>`);
  });
  out.push(`<circle cx="${cx}" cy="${cy}" r="8" fill="${TYPE_COLOR[nodes[i].t] || '#888'}" stroke="${cssVar('--accent')}" stroke-width="2"/>`);
  return `<svg class="ego" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="one-hop neighbourhood">${out.join('')}</svg>`
    + (nb.length > show.length ? `<div style="color:var(--fg3);font-size:10.5px;text-align:center;margin-top:-4px">+${nb.length - show.length} more, listed below</div>` : '');
}

function centerOn(i) {
  const s = Math.max(state.scale, 1);
  camTo(W / 2 - destX(i) * s, H / 2 - destY(i) * s, s);
}

function fit(ms) {
  let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity; let any = false;
  for (let i = 0; i < N; i++) {
    if (!visible[i]) continue;
    if (state.view === 'flow' && !inFlow[i]) continue;
    any = true;
    const w = state.view === 'flow' ? pillW[i] / 2 : radius(i);
    minX = Math.min(minX, destX(i) - w); maxX = Math.max(maxX, destX(i) + w);
    minY = Math.min(minY, destY(i)); maxY = Math.max(maxY, destY(i));
  }
  if (!any) return;
  const pad = 70;
  const topPad = state.view === 'flow' ? 34 : 0;   // room for the sticky lane headers
  const sx = (W - pad * 2) / Math.max(1, maxX - minX);
  const sy = (H - pad * 2 - topPad) / Math.max(1, maxY - minY);
  const scale = Math.min(3, Math.max(0.08, Math.min(sx, sy)));
  camTo(W / 2 - ((minX + maxX) / 2) * scale, (H + topPad) / 2 - ((minY + maxY) / 2) * scale, scale, ms);
}

// ---------------------------------------------------------------- controls
function buildControls() {
  const counts = {};
  for (const n of nodes) counts[n.t] = (counts[n.t] || 0) + 1;
  const typesEl = document.getElementById('types');
  typesEl.innerHTML = Object.keys(counts).sort().map((t) => `
    <label class="row"><input type="checkbox" data-type="${t}"${state.types.has(t) ? ' checked' : ''}>
      <span class="sw" style="background:${TYPE_COLOR[t] || '#888'}"></span>
      ${TYPE_LABEL[t] || t}<span class="n">${counts[t]}</span></label>`).join('');
  typesEl.querySelectorAll('input').forEach((cb) => {
    cb.onchange = () => {
      if (cb.checked) state.types.add(cb.dataset.type); else state.types.delete(cb.dataset.type);
      recomputeVisible(); draw();
    };
  });

  // Provenance and check-state facets only exist on a merged graph (Scope folds another
  // store in and stamps `src`/`chk`). An unmerged file graph has neither, so both sections
  // stay hidden rather than showing an empty box.
  const sc = {};
  for (const n of nodes) if (n.src) sc[n.src] = (sc[n.src] || 0) + 1;
  const skeys = Object.keys(SRC_COLOR).filter((k) => sc[k]);
  if (skeys.length > 1) {
    document.getElementById('src-section').hidden = false;
    const srcEl = document.getElementById('sources');
    srcEl.innerHTML = skeys.map((k) => `
      <label class="row"><input type="checkbox" data-src="${k}" checked>
        <i class="${SRC_SHAPE[k]}" style="color:${SRC_COLOR[k]};width:11px;height:11px;flex:none;border-radius:50%;${SRC_SHAPE[k] ? 'background:none;border:1.5px ' + (k === 'symbols' ? 'dashed' : 'solid') + ' currentColor' : 'background:currentColor'}"></i>
        ${SRC_LABEL[k]} <span style="color:var(--fg3)">· ${SRC_HINT[k]}</span><span class="n">${sc[k]}</span></label>`).join('');
    srcEl.querySelectorAll('input').forEach((cb) => {
      cb.onchange = () => {
        if (cb.checked) state.sources.add(cb.dataset.src); else state.sources.delete(cb.dataset.src);
        recomputeVisible(); draw();
      };
    });
  }

  const cc = {};
  for (const n of nodes) if (n.chk) cc[n.chk] = (cc[n.chk] || 0) + 1;
  const ckeys = Object.keys(CHK_COLOR).filter((k) => cc[k]);
  if (hasCheck) {
    document.getElementById('chk-section').hidden = false;
    const chkEl = document.getElementById('checkstates');
    const clean = nodes.length - ckeys.reduce((a, k) => a + cc[k], 0);
    chkEl.innerHTML = ckeys.map((k) => `
      <label class="row"><input type="checkbox" data-chk="${k}" checked>
        <span class="sw" style="background:${CHK_COLOR[k]}"></span>
        ${CHK_LABEL[k]}<span class="n">${cc[k]}</span></label>`).join('')
      + `<label class="row"><input type="checkbox" data-chk="(clean)" checked>
        <span class="sw" style="background:var(--ok)"></span>
        clean<span class="n">${clean}</span></label>`;
    chkEl.querySelectorAll('input').forEach((cb) => {
      cb.onchange = () => {
        if (cb.checked) state.checks.add(cb.dataset.chk); else state.checks.delete(cb.dataset.chk);
        recomputeVisible(); draw();
      };
    });
  }

  const ekc = { structural: 0, editorial: 0 };
  for (const e of edges) ekc[edgeKindOf(e.type)]++;
  const ekEl = document.getElementById('edgekinds');
  ekEl.innerHTML = ['structural', 'editorial'].map((k) => `
    <label class="row"><input type="checkbox" data-ek="${k}" checked>
      <span class="sw" style="background:${EKIND_COLOR[k]}"></span>
      ${EKIND_LABEL[k]}<span class="n">${ekc[k]}</span></label>`).join('');
  ekEl.querySelectorAll('input').forEach((cb) => {
    cb.onchange = () => {
      if (cb.checked) state.edgeKinds.add(cb.dataset.ek); else state.edgeKinds.delete(cb.dataset.ek);
      recomputeVisible(); draw();
    };
  });

  const gc = {};
  for (let i = 0; i < N; i++) if (gitOf[i]) gc[gitOf[i]] = (gc[gitOf[i]] || 0) + 1;
  const gitEl = document.getElementById('gitstates');
  const gkeys = Object.keys(GIT_COLOR).filter((k) => gc[k]);
  gitEl.innerHTML = gkeys.length ? gkeys.map((g) => `
    <label class="row"><input type="checkbox" data-git="${g}" checked>
      <span class="sw" style="background:${GIT_COLOR[g] || 'var(--ok)'}"></span>
      ${GIT_LABEL[g]}<span class="n">${gc[g]}</span></label>`).join('')
    : '<div style="color:var(--fg3);font-size:11.5px">no git overlay — run scope git-overlay</div>';
  gitEl.querySelectorAll('input').forEach((cb) => {
    cb.onchange = () => {
      if (cb.checked) state.gitFilter.add(cb.dataset.git); else state.gitFilter.delete(cb.dataset.git);
      recomputeVisible(); draw();
    };
  });

  const tagCount = new Map();
  for (const n of nodes) for (const t of n.g || []) tagCount.set(t, (tagCount.get(t) || 0) + 1);
  const top = [...tagCount].sort((a, b) => b[1] - a[1]).slice(0, 22);
  const tagsEl = document.getElementById('tags');
  tagsEl.innerHTML = top.map(([t, c]) => `<button class="chip" data-tag="${escapeHtml(t)}" aria-pressed="false">${escapeHtml(t)} ${c}</button>`).join('');
  tagsEl.querySelectorAll('.chip').forEach((b) => {
    b.onclick = () => {
      const t = b.dataset.tag;
      const on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', on ? 'false' : 'true');
      if (on) state.tags.delete(t); else state.tags.add(t);
      recomputeVisible(); draw();
    };
  });

  // Shape carries what colour cannot: nine categories is past what any palette survives, and
  // past what a deuteranope can separate at all. Hovering a row spotlights the real nodes.
  const legendRows = [
    ['blob', TYPE_COLOR.mod, 'tinted territory — a module and all it holds', null],
    ['sq', TYPE_COLOR.mod, 'square — module', 'mod'],
    ['', TYPE_COLOR.file, 'circle — file', 'file'],
    ['dia', TYPE_COLOR.sym, 'diamond — symbol', 'sym'],
    ['tri', TYPE_COLOR.entry, 'triangle — entrypoint', 'entry'],
    ['', '#9aa7b4', 'size — √degree; the biggest dot is the hub', null],
    ['', SRC_COLOR.both, 'filled — both tools saw it', null],
    ['ring', TYPE_COLOR.file, 'outlined — only the file graph saw it', null],
    ['dashring', TYPE_COLOR.sym, 'dashed outline — only the symbol graph saw it', null],
    ['ring', '#f0a830', 'ring — committed, not pushed', null],
    ['ring2', '#e07b39', 'double ring — modified locally', null],
    ['ring', '#4a90d9', 'ring — staged', null],
    ['dashring', '#a3adb9', 'dashed ring — untracked', null],
    ['ring', '#e05252', 'red ring — conflicted', null],
    ['hex glow', '#3fb950', 'hexagon — open issue (glow = ready)', 'issue'],
    ['hex', '#6b7885', 'hexagon — closed issue', null],
    ['line', '#e05252', 'red dashed edge — blocks / import cycle', null],
    ['hatch', '#f0a830', '✕ over the node — summary is stale', null],
    ['', HOP_COLOR(1), 'impact: 1 hop away — what you break today', null],
    ['', HOP_COLOR(6), 'impact: far away — reachable, not urgent', null],
  ];
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = legendRows.map(([shape, c, label, spot]) =>
    `<div class="legend-item"${spot ? ` data-spot="${spot}"` : ''}><i class="${shape}" style="color:${c}">`
    + `${shape === 'hatch' ? '✕' : ''}</i>${label}</div>`).join('');
  // Hovering a legend row is a question -- "which ones are those?" -- and the graph answers it
  // by dimming everything else, instead of leaving you to match a swatch by eye.
  legendEl.querySelectorAll('[data-spot]').forEach((row) => {
    row.onmouseenter = () => { state.spotlight = row.dataset.spot; draw(); };
    row.onmouseleave = () => { state.spotlight = null; draw(); };
  });
}

// When nothing is on screen, say which control did it -- an empty canvas that does not explain
// itself reads as a broken viewer rather than an over-tight filter.
function diagnoseEmpty(shown) {
  const el = document.getElementById('empty');
  if (shown > 0) { el.classList.remove('on'); return; }
  const causes = [];
  if (state.search.trim()) causes.push(['no node matches “' + state.search.trim() + '”', 'search']);
  if (state.work) causes.push(['“Work in flight” is on and nothing is uncommitted', 'work']);
  if (state.disagree) causes.push(['“Only one tool sees it” is on and the two graphs agree everywhere', 'disagree']);
  if (state.tags.size) causes.push([state.tags.size + ' tag filter(s) are on', 'tags']);
  if (state.types.size < new Set(nodes.map((n) => n.t)).size) causes.push(['some node types are unticked', 'types']);
  if (state.view === 'flow') causes.push(['this graph has no imports or calls to lay out', 'flow']);
  const why = causes.length ? causes[0] : ['every node is filtered out', 'all'];
  el.classList.add('on');
  el.firstElementChild.innerHTML = '<b>Nothing to draw</b><p>' + escapeHtml(why[0])
    + '.</p><button id="empty-reset">Clear all filters</button>';
  el.querySelector('#empty-reset').onclick = resetFilters;
}

function resetFilters() {
  state.search = ''; document.getElementById('search').value = '';
  state.work = false; state.disagree = false;
  state.tags.clear();
  state.types = new Set(nodes.map((n) => n.t));
  state.gitFilter = new Set(Object.keys(GIT_COLOR));
  state.sources = new Set(nodes.map((n) => n.src).filter(Boolean));
  state.checks = new Set(['drift', 'dangling', 'orphan', 'ambiguous', '(clean)']);
  state.edgeKinds = new Set(['structural', 'editorial']);
  buildControls();
  document.getElementById('preset-work').setAttribute('aria-pressed', 'false');
  document.getElementById('preset-disagree').setAttribute('aria-pressed', 'false');
  recomputeVisible(); fit();
}

function setView(v) {
  if (v === state.view) return;
  motion.flightFrom = state.view;
  motion.flightRaw = REDUCED ? 1 : 0;
  motion.flight = motion.flightRaw;
  state.view = v;
  document.getElementById('tab-graph').setAttribute('aria-selected', String(v === 'graph'));
  document.getElementById('tab-flow').setAttribute('aria-selected', String(v === 'flow'));
  document.getElementById('stage').classList.toggle('flow', v === 'flow');
  recomputeVisible();
  recomputeLit();
  fit(700);
  if (v === 'graph') alpha = Math.max(alpha, 0.35);
  tick();
}

document.getElementById('tab-graph').onclick = () => { setView('graph'); writeHash(); };
document.getElementById('tab-flow').onclick = () => { setView('flow'); writeHash(); };
document.getElementById('fit').onclick = () => fit();
document.getElementById('toggle-hulls').onclick = (e) => {
  state.hulls = !state.hulls;
  e.currentTarget.setAttribute('aria-pressed', String(state.hulls));
  draw();
};
document.getElementById('toggle-lod').onclick = (e) => {
  state.lod = !state.lod;
  e.currentTarget.setAttribute('aria-pressed', String(state.lod));
  draw();
};
document.getElementById('preset-work').onclick = (e) => {
  state.work = !state.work;
  e.currentTarget.setAttribute('aria-pressed', String(state.work));
  recomputeVisible(); fit(); writeHash();
};
document.getElementById('preset-disagree').onclick = (e) => {
  state.disagree = !state.disagree;
  e.currentTarget.setAttribute('aria-pressed', String(state.disagree));
  recomputeVisible(); fit();
};
document.getElementById('preset-impact').onclick = (e) => {
  state.impact = !state.impact;
  e.currentTarget.setAttribute('aria-pressed', String(state.impact));
  recomputeLit(); writeHash(); tick();
};
const searchEl = document.getElementById('search');
searchEl.oninput = () => {
  state.search = searchEl.value;
  recomputeVisible(); writeHash(); draw();
};
searchEl.onkeydown = (e) => {
  if (e.key !== 'Enter') return;
  for (let i = 0; i < N; i++) if (matched[i]) { select(i); centerOn(i); break; }
};
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') { searchEl.value = ''; state.search = ''; recomputeVisible(); draw(); searchEl.blur(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); searchEl.focus(); }
  else if (e.key === 'f') fit();
  else if (e.key === 'Escape') select(null);
});

function plural(n, one, many) { return n === 1 ? one : many; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------- boot
// One loop drives everything that moves: the force sim, the tab flight, the impact ripple,
// the camera tween, the load settle and the marching ants. It stops the moment none of them
// has anything left to do, so an idle viewer costs nothing.
let raf = null;
let lastT = 0;
function tick() {
  if (raf) return;
  lastT = 0;
  const loop = (ts) => {
    raf = null;
    const dt = lastT ? Math.min(0.05, (ts - lastT) / 1000) : 0.016;
    lastT = ts;
    let busy = false;

    if (state.view === 'graph' && alpha > 0.02 && motion.flightRaw >= 1) { step(); busy = true; }
    if (motion.settle < 1) { motion.settle = Math.min(1, motion.settle + dt / 1.1); busy = true; }
    if (motion.flightRaw < 1) {
      motion.flightRaw = Math.min(1, motion.flightRaw + dt / 0.75);
      motion.flight = easeInOut(motion.flightRaw);
      if (motion.flightRaw >= 1) recomputeVisible();
      busy = true;
    }
    if (motion.ripple >= 0 && motion.ripple !== Infinity) {
      motion.ripple += dt;
      if (motion.ripple * RIPPLE_HOPS_PER_SEC < motion.rippleFar + 1.5) busy = true;
    }
    if (state.view === 'flow' && state.selected !== null && !REDUCED) {
      motion.dash = (motion.dash + dt * 46) % 1200; busy = true;
    }
    if (motion.cam) {
      const c = motion.cam;
      c.t = Math.min(1, c.t + (dt * 1000) / c.ms);
      const k = easeInOut(c.t);
      state.tx = c.fx + (c.tx - c.fx) * k;
      state.ty = c.fy + (c.ty - c.fy) * k;
      state.scale = c.fs + (c.ts - c.fs) * k;
      if (c.t >= 1) motion.cam = null; else busy = true;
    }
    draw();
    if (busy) raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

document.getElementById('repo-name').textContent =
  (DATA.meta && DATA.meta.name ? DATA.meta.name : '') + (DATA.meta && DATA.meta.repo ? ' · ' + DATA.meta.repo : '');

if (DATA.git && DATA.git.notes && DATA.git.notes.length) {
  const b = document.getElementById('banner');
  b.textContent = DATA.git.notes[0];
  b.style.display = 'block';
}

resize();
seedGraphLayout();
buildSprings();
computeFlowLayout();
buildControls();
recomputeVisible();
for (let k = 0; k < 260; k++) step();
fit(0);
// A pasted link is the state, so it has to be applied before the first paint settles.
const deepLinked = applyHash();
tick();

// Re-fit once real layout dimensions exist. Fonts and flex sizing land after the first paint,
// so the boot-time fit is a best guess. A deep link already framed its own target.
requestAnimationFrame(() => { resize(); if (!deepLinked) fit(0); });
window.addEventListener('load', () => { resize(); if (!deepLinked) fit(0); });
</script>
</body>
