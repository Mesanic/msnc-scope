<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scope</title>
<style>
:root {
  --bg: #0e1116; --panel: #161b22; --panel2: #1c232c; --line: #2a323d;
  --fg: #e6edf3; --fg2: #9aa7b4; --fg3: #6b7embed;
  --accent: #4a9eff; --edge: #333d49; --edge-hi: #7fb2ff;
  --warn: #f0a830; --danger: #e05252; --ok: #3fb950;
}
:root { --fg3: #6b7885; }
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --line: #d8dee4;
    --fg: #1f2328; --fg2: #57606a; --fg3: #8c959f;
    --accent: #0969da; --edge: #c4ccd4; --edge-hi: #0969da;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 14px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap;
}
.brand { font-weight: 650; letter-spacing: .02em; }
.brand small { color: var(--fg2); font-weight: 400; margin-left: 8px; }
.tabs { display: flex; background: var(--panel2); border-radius: 7px; padding: 2px; }
.tabs button {
  border: 0; background: transparent; color: var(--fg2); font: inherit; font-weight: 550;
  padding: 5px 14px; border-radius: 5px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
#search {
  flex: 1; min-width: 180px; max-width: 380px; background: var(--panel2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; font: inherit;
}
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.counts { color: var(--fg2); font-variant-numeric: tabular-nums; margin-left: auto; }
main { flex: 1; display: flex; min-height: 0; }
aside {
  width: 232px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px;
}
aside h3 {
  margin: 0 0 7px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--fg3); font-weight: 650;
}
.row { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; font-size: 12.5px; }
.row input { accent-color: var(--accent); margin: 0; cursor: pointer; }
.row .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.row .n { margin-left: auto; color: var(--fg3); font-variant-numeric: tabular-nums; font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  border: 1px solid var(--line); background: var(--panel2); color: var(--fg2);
  border-radius: 20px; padding: 2px 9px; font-size: 11px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel2);
  color: var(--fg); border-radius: 7px; padding: 7px 10px; font: inherit; cursor: pointer;
  margin-bottom: 5px;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn small { display: block; color: var(--fg3); font-size: 10.5px; margin-top: 1px; }
.btn[aria-pressed="true"] small { color: rgba(255,255,255,.8); }
#stage { flex: 1; position: relative; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }
#tip {
  position: absolute; pointer-events: none; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 11.5px;
  max-width: 330px; box-shadow: 0 6px 18px rgba(0,0,0,.35); display: none; z-index: 5;
}
#tip b { color: var(--accent); }
#crumbs {
  position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font-size: 11.5px;
  color: var(--fg2); display: none; z-index: 4; overflow-x: auto; white-space: nowrap;
}
#crumbs b { color: var(--fg); }
#crumbs .sep { color: var(--accent); margin: 0 6px; }
#banner {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: var(--warn); color: #201a08; border-radius: 20px; padding: 4px 14px;
  font-size: 11.5px; font-weight: 550; display: none; z-index: 4;
}
#detail {
  width: 330px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding: 14px; display: none;
}
#detail.open { display: block; }
#detail .key { font-weight: 650; word-break: break-all; margin-bottom: 3px; }
#detail .meta { color: var(--fg3); font-size: 11px; margin-bottom: 10px; }
#detail .sum {
  background: var(--panel2); border-left: 2px solid var(--accent); padding: 8px 10px;
  border-radius: 0 6px 6px 0; margin-bottom: 12px; font-size: 12.5px;
}
#detail h4 {
  margin: 14px 0 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--fg3);
}
#detail a.node {
  display: block; color: var(--accent); text-decoration: none; padding: 2px 0;
  font-size: 12px; cursor: pointer; word-break: break-all;
}
#detail a.node:hover { text-decoration: underline; }
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10.5px;
  font-weight: 600; margin-right: 5px;
}
.close { float: right; border: 0; background: none; color: var(--fg3); cursor: pointer; font-size: 17px; line-height: 1; }
code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; word-break: break-all; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--fg2); padding: 1.5px 0; }
/* Swatches mirror the shapes the canvas draws — a flat dot for every row would collapse
   ring vs hexagon vs hatch, and the two orange encodings would be indistinguishable. */
.legend-item i { width: 13px; height: 13px; flex: none; border-radius: 50%; background: currentColor; }
.legend-item i.ring { background: none; border: 1.5px solid currentColor; }
.legend-item i.ring2 { background: none; border: 1.5px solid currentColor; box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px currentColor; }
.legend-item i.dashring { background: none; border: 1.5px dashed currentColor; }
.legend-item i.hex { border-radius: 0; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
.legend-item i.hex.glow { box-shadow: 0 0 7px currentColor; }
.legend-item i.line { border-radius: 0; height: 0; background: none; border-top: 2px dashed currentColor; }
.legend-item i.hatch { background: none; border-radius: 0; font-size: 12px; line-height: 13px; text-align: center; font-style: normal; }
.empty { color: var(--fg3); font-size: 12px; padding: 20px; text-align: center; }
.legend-item[data-spot] { cursor: pointer; border-radius: 4px; padding: 1.5px 3px; margin: 0 -3px; }
.legend-item[data-spot]:hover { background: var(--panel2); color: var(--fg); }
.legend-item i.tri { border-radius: 0; background: none; border-left: 6.5px solid transparent; border-right: 6.5px solid transparent; border-bottom: 11px solid currentColor; height: 0; }
.legend-item i.sq { border-radius: 2px; }
.legend-item i.dia { border-radius: 1px; transform: rotate(45deg) scale(.8); }
.legend-item i.blob { border-radius: 50%; background: currentColor; opacity: .28; box-shadow: 0 0 0 3px currentColor; }
#zoomhint {
  position: absolute; right: 12px; top: 10px; background: var(--panel); border: 1px solid var(--line);
  color: var(--fg3); border-radius: 20px; padding: 3px 11px; font-size: 11px; z-index: 4;
  pointer-events: none; font-variant-numeric: tabular-nums;
}
#empty {
  position: absolute; inset: 0; display: none; place-content: center; text-align: center;
  pointer-events: none; padding: 40px;
}
#empty.on { display: grid; }
#empty div { pointer-events: auto; max-width: 380px; margin: 0 auto; }
#empty b { display: block; font-size: 15px; margin-bottom: 6px; }
#empty p { color: var(--fg2); font-size: 12.5px; margin: 0 0 12px; }
#empty button {
  border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit;
  border-radius: 7px; padding: 6px 14px; cursor: pointer;
}
/* File X-ray: the file as a strip of its own lines, every symbol a tick where it starts. */
.xray { margin: 4px 0 10px; }
.xr-bar {
  position: relative; height: 34px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 5px; overflow: hidden;
}
.xr-bar i {
  position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .75;
}
.xr-bar i:hover { opacity: 1; width: 3px; }
.xr-scale { display: flex; justify-content: space-between; color: var(--fg3); font-size: 10px; margin-top: 2px; }
.ego { width: 100%; height: 150px; display: block; }
.ego text { font: 9px ui-sans-serif, system-ui; fill: var(--fg2); }
</style>
</head>
<body>
<header>
  <div class="brand">scope <small id="repo-name"></small></div>
  <div class="tabs" role="tablist">
    <button id="tab-graph" role="tab" aria-selected="true">Knowledge graph</button>
    <button id="tab-flow" role="tab" aria-selected="false">Flow</button>
  </div>
  <input id="search" type="search" placeholder="Search paths, symbols, summaries…  ( / )">
  <div class="counts" id="counts"></div>
</header>

<main>
  <aside>
    <div>
      <h3>Views</h3>
      <button class="btn" id="preset-work" aria-pressed="false">Work in flight
        <small>uncommitted files and open issues</small></button>
      <button class="btn" id="preset-impact" aria-pressed="false">Impact mode
        <small>highlight what breaks if the selection changes</small></button>
      <button class="btn" id="preset-disagree" aria-pressed="false">Only one tool sees it
        <small>where the two graphs disagree</small></button>
      <button class="btn" id="fit">Fit to screen <small>key: f</small></button>
    </div>
    <div>
      <h3>Display</h3>
      <button class="btn" id="toggle-hulls" aria-pressed="true">Containment as territory
        <small>hulls instead of 1107 part-of lines</small></button>
      <button class="btn" id="toggle-lod" aria-pressed="true">Semantic zoom
        <small>modules → files → symbols as you zoom</small></button>
    </div>
    <div><h3>Node types</h3><div id="types"></div></div>
    <div id="src-section" hidden><h3>Known to</h3><div id="sources"></div></div>
    <div id="chk-section" hidden><h3>Check state</h3><div id="checkstates"></div></div>
    <div><h3>Relationships</h3><div id="edgekinds"></div></div>
    <div><h3>Git state</h3><div id="gitstates"></div></div>
    <div><h3>Tags</h3><div class="chips" id="tags"></div></div>
    <div><h3>Legend</h3><div id="legend"></div></div>
  </aside>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="tip"></div>
    <div id="crumbs"></div>
    <div id="banner"></div>
    <div id="zoomhint"></div>
    <div id="empty"><div></div></div>
  </div>

  <div id="detail"></div>
</main>

<script id="scope-data" type="application/json">/*__SCOPE_DATA__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('scope-data').textContent);

// Four tables used to overlap: file was the same blue as "structural", symbol the same green
// as "symbols", module the same purple as "ambiguous". Colour alone also cannot carry nine
// categories for a deuteranope, so each table now owns a band -- node types are the only
// saturated one -- and the four types that matter structurally carry a SHAPE as well, which
// survives any colour vision. Hues are Okabe-Ito derived, lifted for a dark ground.
const TYPE_COLOR = {
  entry: '#ef6f2c', file: '#5cb8ec', mod: '#c77dd8', sym: '#19a97c',
  concept: '#d9b13c', adr: '#7d74f0', skill: '#2bb5b0', note: '#8a8f98', issue: '#3fb950',
};
const TYPE_SHAPE = {
  entry: 'triangle', file: 'circle', mod: 'square', sym: 'diamond',
  concept: 'circle', adr: 'circle', skill: 'square', note: 'circle', issue: 'hexagon',
};
const TYPE_LABEL = {
  entry: 'entrypoint', file: 'file', mod: 'module', sym: 'symbol',
  concept: 'concept', adr: 'decision', skill: 'Scope itself', note: 'note', issue: 'issue',
};
// Two organizing principles share this graph. STRUCTURAL edges describe how the code
// actually hangs together; EDITORIAL edges describe what people said about it. On one
// repo editorial outnumbered structural 1385 to 1236 -- more than half the graph is
// commentary -- and drawn identically the two are impossible to tell apart.
const STRUCTURAL_EDGES = new Set(['imports', 'exports', 'calls', 'part-of', 'implements', 'tested-by']);
const edgeKindOf = (t) => (STRUCTURAL_EDGES.has(t) ? 'structural' : 'editorial');
// Desaturated on purpose: these are the colours the canvas actually strokes edges with, and
// an edge sits behind every node. Before, the swatch promised blue/amber and the canvas drew
// everything grey -- the legend was describing a picture that did not exist.
const EKIND_COLOR = { structural: '#7f93ab', editorial: '#b39a63' };
const EKIND_LABEL = { structural: 'structural (imports, calls, tests)', editorial: 'editorial (issues, docs, notes)' };
// Provenance is drawn on the node itself as fill-vs-outline, not as a hue, so the facet
// swatches mirror that shape instead of inventing three more colours that collide with the
// node types. SRC_SHAPE is the legend's half of the same encoding.
const SRC_COLOR = { both: '#c9d4e0', files: '#93a3b5', symbols: '#93a3b5' };
const SRC_SHAPE = { both: '', files: 'ring', symbols: 'dashring' };
const SRC_HINT = { both: 'solid', files: 'outlined', symbols: 'dashed outline' };
const SRC_LABEL = { both: 'both engines', files: 'file graph only', symbols: 'symbol graph only' };
const CHK_COLOR = { drift: '#e08a2e', dangling: '#e0455f', orphan: '#9aa7b4', ambiguous: '#b06fd0' };
const CHK_LABEL = { drift: 'drifted', dangling: 'dangling ref', orphan: 'orphaned note', ambiguous: 'ambiguous note' };
const GIT_COLOR = {
  pushed: null, unpushed: '#f0a830', staged: '#4a90d9',
  modified: '#e07b39', untracked: '#a3adb9', conflicted: '#e05252',
};
const GIT_LABEL = {
  pushed: 'pushed', unpushed: 'committed, not pushed', staged: 'staged',
  modified: 'modified', untracked: 'untracked', conflicted: 'conflicted',
};
const FLOW_TYPES = new Set(['imports', 'calls']);
const FLOW_NODE_TYPES = new Set(['file', 'entry', 'mod', 'adr']);
// Containment is drawn as enclosure, never as a line. On a merged graph part-of is 49% of all
// edges (1107 of 2258 on the reference repo) and drawn as a line it is indistinguishable from
// a dependency -- half the ink saying "these two things are near each other", which the hull
// says better. The springs stay: containment is what pulls a file's symbols into a clump.
const CONTAIN_TYPES = new Set(['part-of']);
// A test file is a leaf of the dependency graph that happens to have no importers, so
// longest-path layering files it under "entry points" beside src/index.ts. It is not one.
const RE_TEST_DIR = /(^|\/)(tests?|spec|__tests__)\//i;
const RE_TEST_FILE = /(^|\/)(test_[^/]*|[^/]*[._](test|spec))\.[a-z]+$/i;
const RE_TEST_BARE = /(^|\/)tests\.[a-z]+$/i;
const isTestPath = (k) => RE_TEST_DIR.test(k) || RE_TEST_FILE.test(k) || RE_TEST_BARE.test(k);

// ---------------------------------------------------------------- model
const nodes = DATA.nodes;
const N = nodes.length;
const idx = new Map();
nodes.forEach((n, i) => idx.set(n.id, i));

const edges = [];
for (const e of DATA.edges) {
  const a = idx.get(e[0]);
  const b = idx.get(e[2]);
  if (a === undefined || b === undefined) continue;
  edges.push({ a, b, type: e[1], ei: edges.length });
}

const gitOf = new Array(N).fill(null);
if (DATA.git) {
  const def = DATA.git.default || null;
  for (let i = 0; i < N; i++) {
    const n = nodes[i];
    if (!['file', 'entry', 'adr'].includes(n.t)) continue;
    gitOf[i] = (DATA.git.files && DATA.git.files[n.k]) || def;
  }
}
const issueOf = new Array(N).fill(null);
if (DATA.issues) {
  for (let i = 0; i < N; i++) {
    if (nodes[i].t !== 'issue') continue;
    issueOf[i] = DATA.issues.issues[nodes[i].k.replace('#', '')] || null;
  }
}

const outAdj = Array.from({ length: N }, () => []);
const inAdj = Array.from({ length: N }, () => []);
edges.forEach((e, ei) => { outAdj[e.a].push(ei); inAdj[e.b].push(ei); });

// Degree drives node size from here on. radius() used to read `w`, which ran 1..8 on the
// reference graph and mapped 65% of nodes into a 1.3px band while real degree ran 0..173 --
// the hub you need to find first drew the same size as a leaf.
const deg = new Int32Array(N);
for (const e of edges) { deg[e.a]++; deg[e.b]++; }
let maxDeg = 1;
for (let i = 0; i < N; i++) if (deg[i] > maxDeg) maxDeg = deg[i];

// Containment tree, read off the part-of edges the graph no longer draws as lines. Symbols
// hang under their file, files under their module, modules under a parent module.
const parentOf = new Int32Array(N).fill(-1);
const childrenOf = Array.from({ length: N }, () => []);
for (const e of edges) {
  if (!CONTAIN_TYPES.has(e.type)) continue;
  if (e.a === e.b || parentOf[e.a] !== -1) continue;   // one parent per node; first wins
  parentOf[e.a] = e.b;
  childrenOf[e.b].push(e.a);
}
const rootOf = new Int32Array(N);
for (let i = 0; i < N; i++) {
  let d = 0; let c = i;
  while (parentOf[c] !== -1 && d < 8) { c = parentOf[c]; d++; }
  rootOf[i] = c;
}

// Which zoom releases a node. Keyed on type, not on depth in the containment tree: 144 of the
// 288 files live inside a nested module and 147 symbols hang off a file with no module at
// all, so tree depth put symbols on screen before the files holding them.
const LOD_TIER = {
  mod: 0, concept: 0, adr: 0, issue: 0,
  entry: 1, file: 1, skill: 1, note: 1,
  sym: 2,
};
const tierOf = (i) => (LOD_TIER[nodes[i].t] === undefined ? 1 : LOD_TIER[nodes[i].t]);

// Territories have to be bodies, not just piles of nodes. Node-level repulsion runs on a
// 92px grid and dies past 184 units, which cannot stop two 400-unit-wide modules sitting on
// top of each other -- and two interpenetrating hulls are worse than no hulls at all. So a
// module also repels as one whole body at centroid level: 28 objects, 378 pairs, free.
const groupOf = new Int32Array(N).fill(-1);
const groupRoot = [];
{
  const seen = new Map();
  for (let i = 0; i < N; i++) {
    const r = rootOf[i];
    if (nodes[r].t !== 'mod') continue;
    if (!seen.has(r)) { seen.set(r, groupRoot.length); groupRoot.push(r); }
    groupOf[i] = seen.get(r);
  }
}
const G = groupRoot.length;
const gcx = new Float64Array(G); const gcy = new Float64Array(G);
const gcn = new Int32Array(G); const gcr = new Float64Array(G);
const gpush = new Float64Array(G * 2);

// The flow sub-graph deliberately excludes symbols so the layered view stays file-shaped.
// Impact must not. `calls` is 889 of 2258 edges on the reference graph and every one is
// symbol-to-symbol, so "what breaks if I change this function" -- the question Scope
// exists to answer -- returned nothing for 795 of 1141 nodes. impIn/impOut span both tiers
// and let containment carry the blast upward: change a symbol and its file has changed, so
// that file's importers are inside the radius too.
const impIn = Array.from({ length: N }, () => []);
const impOut = Array.from({ length: N }, () => []);
for (const e of edges) {
  if (FLOW_TYPES.has(e.type)) { impIn[e.b].push(e.a); impOut[e.a].push(e.b); }
  // a --tested-by--> b: a is the subject, b the test. Change a and b is what goes red.
  else if (e.type === 'tested-by') { impIn[e.a].push(e.b); impOut[e.b].push(e.a); }
  else if (CONTAIN_TYPES.has(e.type)) { impIn[e.a].push(e.b); impOut[e.b].push(e.a); }
}

// Flow sub-graph: dependency direction only, over code-ish nodes.
const flowOut = Array.from({ length: N }, () => []);
const flowIn = Array.from({ length: N }, () => []);
const inFlow = new Array(N).fill(false);
for (const e of edges) {
  if (!FLOW_TYPES.has(e.type)) continue;
  if (!FLOW_NODE_TYPES.has(nodes[e.a].t) || !FLOW_NODE_TYPES.has(nodes[e.b].t)) continue;
  flowOut[e.a].push(e.b); flowIn[e.b].push(e.a);
  inFlow[e.a] = true; inFlow[e.b] = true;
}

// Hop counts, not just membership: the ripple animates by distance and the rings are drawn
// per hop, so a 9-hop dependent has to be distinguishable from a direct one.
function bfsHops(start, adj) {
  const hop = new Int16Array(N).fill(-1);
  hop[start] = 0;
  let frontier = [start];
  let d = 0;
  let far = 0;
  while (frontier.length && d < 32) {
    const next = [];
    d++;
    for (const cur of frontier) {
      for (const nx of adj[cur]) {
        if (hop[nx] !== -1) continue;
        hop[nx] = d; far = d; next.push(nx);
      }
    }
    frontier = next;
  }
  return { hop, far };
}

function walk(start, adj) {
  const seen = new Set([start]);
  const stack = [start];
  const out = [];
  while (stack.length) {
    const cur = stack.pop();
    for (const nx of adj[cur]) {
      if (seen.has(nx)) continue;
      seen.add(nx); out.push(nx); stack.push(nx);
    }
  }
  return out;
}

// ---------------------------------------------------------------- state
const ALL_TYPES = new Set(nodes.map((n) => n.t));
const hasCheck = nodes.some((n) => n.chk);
const state = {
  view: 'graph',
  selected: null,
  hover: null,
  search: '',
  // Symbols used to start unticked -- a binary "too many, hide them" that made descending to
  // the call tier a checkbox rather than a move. Semantic zoom replaces it: every tier is on,
  // and the zoom level decides which one is legible. The checkbox still hard-filters.
  types: new Set(nodes.map((n) => n.t)),
  gitFilter: new Set(Object.keys(GIT_COLOR)),
  tags: new Set(),
  sources: new Set(nodes.map((n) => n.src).filter(Boolean)),
  checks: new Set(['drift', 'dangling', '(clean)']),
  work: false,
  disagree: false,
  edgeKinds: new Set(['structural', 'editorial']),
  impact: false,
  hulls: true,
  lod: true,
  spotlight: null,      // node type a hovered legend row is spotlighting
  scale: 1, tx: 0, ty: 0,
};

// Motion lives in one place so a single reduced-motion check can flatten all of it.
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const motion = {
  ripple: -1,          // seconds since the impact ripple started; -1 = idle
  rippleFar: 0,
  flight: 1,           // eased 0..1 graph->flow interpolation; 1 = settled in state.view
  flightRaw: 1,
  flightFrom: 'graph',
  settle: REDUCED ? 1 : 0,   // 0..1 load choreography
  cam: null,           // eased camera tween
  dash: 0,             // marching-ants phase for the selected flow path
};
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

const visible = new Uint8Array(N);
const matched = new Uint8Array(N);
const lit = new Uint8Array(N);      // flow ribbon / impact highlight
const seqOf = new Int16Array(N).fill(-1);
const hopOf = new Int16Array(N).fill(-1);   // distance from the selection, in impact hops

function isWorkNode(i) {
  const g = gitOf[i];
  if (g && g !== 'pushed') return true;
  const iss = issueOf[i];
  if (iss && iss.state === 'open') return true;
  for (const ei of [...outAdj[i], ...inAdj[i]]) {
    const e = edges[ei];
    if (e.type !== 'mentions' && e.type !== 'closes') continue;
    const other = e.a === i ? e.b : e.a;
    const o = issueOf[other];
    if (o && o.state === 'open') return true;
  }
  return false;
}

function recomputeVisible() {
  const q = state.search.trim().toLowerCase();
  let shown = 0; let hits = 0;
  for (let i = 0; i < N; i++) {
    const n = nodes[i];
    let ok = state.types.has(n.t) && n.st !== 'dead';
    if (ok && state.view === 'flow' && motion.flightRaw >= 1) ok = inFlow[i];
    if (ok && gitOf[i]) ok = state.gitFilter.has(gitOf[i]);
    if (ok && state.tags.size) ok = (n.g || []).some((t) => state.tags.has(t));
    if (ok && n.src) ok = state.sources.has(n.src);
    if (ok && hasCheck) ok = state.checks.has(n.chk || '(clean)');
    // "Only one tool sees it": the disagreement between the two graphs, which is the
    // reason a merged graph is worth building at all.
    if (ok && state.disagree) ok = n.src === 'files' || n.src === 'symbols';
    if (ok && state.work) ok = isWorkNode(i);
    visible[i] = ok ? 1 : 0;
    if (ok) shown++;
    matched[i] = 0;
    if (q && ok) {
      const hay = (n.k + ' ' + (n.s || '') + ' ' + (n.g || []).join(' ')).toLowerCase();
      if (hay.includes(q)) { matched[i] = 1; hits++; }
    }
  }
  // Count the edges actually on screen — the flow view draws only imports/calls, so reporting
  // the whole edge list there overstates what is being shown by an order of magnitude.
  let drawn = 0;
  for (const e of edges) {
    if (!visible[e.a] || !visible[e.b]) continue;
    if (state.view === 'flow' && !FLOW_TYPES.has(e.type)) continue;
    // Containment is drawn as a hull, so counting its edges here would report ink that is
    // not on the screen -- the same overstatement the flow view already guards against.
    if (state.view === 'graph' && state.hulls && CONTAIN_TYPES.has(e.type)) continue;
    if (!state.edgeKinds.has(edgeKindOf(e.type))) continue;
    drawn++;
  }
  document.getElementById('counts').textContent =
    q ? `${hits} match / ${shown} shown` : `${shown} of ${N} nodes · ${drawn} of ${edges.length} edges`;
  diagnoseEmpty(shown);
  recomputeLit();
}

function recomputeLit() {
  lit.fill(0);
  seqOf.fill(-1);
  hopOf.fill(-1);
  motion.ripple = -1;
  const sel = state.selected;
  if (sel === null) { drawCrumbs(null); return; }
  lit[sel] = 1;
  hopOf[sel] = 0;
  if (state.impact) {
    // Impact walks the cross-tier graph, so selecting a function actually answers the
    // question. Hop counts are kept: the ripple replays them and the rings draw them.
    const up = bfsHops(sel, impIn);
    const down = bfsHops(sel, impOut);
    for (let i = 0; i < N; i++) {
      if (up.hop[i] > 0) { lit[i] = 2; hopOf[i] = up.hop[i]; }
      else if (down.hop[i] > 0) { lit[i] = 3; if (hopOf[i] < 0) hopOf[i] = down.hop[i]; }
    }
    motion.rippleFar = Math.max(1, up.far);
    motion.ripple = REDUCED ? Infinity : 0;   // reduced motion shows the settled end state
    drawCrumbs(state.view === 'flow' ? longestChainSeq(sel) : null);
  } else if (state.view === 'flow') {
    for (const i of walk(sel, flowIn)) lit[i] = 2;    // upstream: breaks if this changes
    for (const i of walk(sel, flowOut)) lit[i] = 3;   // downstream: what this relies on
    drawCrumbs(longestChainSeq(sel));
  } else {
    for (const ei of outAdj[sel]) lit[edges[ei].b] = 3;
    for (const ei of inAdj[sel]) lit[edges[ei].a] = 2;
    drawCrumbs(null);
  }
}

function longestChainSeq(sel) {
  const chain = longestChain(sel);
  chain.forEach((i, k) => { seqOf[i] = k + 1; });
  return chain;
}

// Prefer a chain that starts at a declared entrypoint - "reached from src/index.ts" explains
// something; "reached from a test file" does not.
function longestChain(target) {
  let best = [target]; let bestScore = -1;
  const stack = [[target, [target], new Set([target])]];
  let steps = 0;
  while (stack.length && steps++ < 20000) {
    const [cur, path, seen] = stack.pop();
    const parents = flowIn[cur].filter((p) => !seen.has(p));
    if (!parents.length || path.length > 14) {
      const score = (nodes[cur].t === 'entry' ? 1000 : 0) + path.length;
      if (score > bestScore) { bestScore = score; best = path; }
      continue;
    }
    for (const p of parents) { const s = new Set(seen); s.add(p); stack.push([p, [...path, p], s]); }
  }
  return best.slice().reverse();
}

function drawCrumbs(chain) {
  const el = document.getElementById('crumbs');
  if (!chain || chain.length < 2) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<b>Execution path:</b> ' + chain
    .map((i, k) => `<span>${k + 1}. ${escapeHtml(nodes[i].k)}</span>`)
    .join('<span class="sep">→</span>');
}

// ---------------------------------------------------------------- layout
const px = new Float32Array(N); const py = new Float32Array(N);
const vx = new Float32Array(N); const vy = new Float32Array(N);
const fx = new Float32Array(N); const fy = new Float32Array(N);
let alpha = 1;
let pinned = -1;

function hash01(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;

function seedGraphLayout() {
  const mods = nodes.map((n, i) => (n.t === 'mod' ? i : -1)).filter((i) => i >= 0);
  const centers = new Map();
  // Wide enough that each module gets roughly its own diameter of arc. The old ring gave 28
  // modules 134 units of arc each to hold bodies four times that wide.
  const R = 300 + mods.length * 52;
  mods.forEach((i, k) => {
    const a = (k / Math.max(1, mods.length)) * Math.PI * 2;
    centers.set(nodes[i].k, [Math.cos(a) * R, Math.sin(a) * R]);
    px[i] = Math.cos(a) * R; py[i] = Math.sin(a) * R;
  });
  for (let i = 0; i < N; i++) {
    if (nodes[i].t === 'mod') continue;
    const k = nodes[i].k;
    const dir = k.includes('/') ? k.slice(0, k.lastIndexOf('/')) : null;
    const c = (dir && centers.get(dir)) || [0, 0];
    const a = hash01(k) * Math.PI * 2;
    const r = 40 + hash01(k + '!') * 130;
    px[i] = c[0] + Math.cos(a) * r;
    py[i] = c[1] + Math.sin(a) * r;
  }
}

// A hull is only readable if the things it wraps are actually near each other, so once
// containment stopped being a line it had to become a stronger force instead. Containment
// springs are short and stiff and sized by tier -- symbols sit right on their file, files
// orbit their module -- which is what turns a hairball into separable territory.
const springs = [];
function buildSprings() {
  springs.length = 0;
  for (const e of edges) {
    if (CONTAIN_TYPES.has(e.type)) {
      // Rest length scales with how many siblings share the parent, so a file holding thirty
      // symbols gets a disc to hold them in rather than a knot.
      const kids = Math.sqrt(childrenOf[e.b].length || 1);
      const rest = nodes[e.a].t === 'sym' ? 16 + kids * 6
        : nodes[e.a].t === 'mod' ? 210
          : 70 + kids * 10;
      springs.push([e.a, e.b, rest, 0.04]);
      continue;
    }
    // A call from one module into another is the single strongest force smearing a module
    // across the map: 889 of them, each dragging one symbol out of its own territory. They
    // still pull -- that is the dependency structure -- but softly and from further away.
    const cross = groupOf[e.a] !== groupOf[e.b];
    const base = (e.type === 'blocks' || e.type === 'mentions') ? 95 : 62;
    springs.push([e.a, e.b, cross ? base * 2.4 : base, cross ? 0.006 : 0.026]);
  }
}

const CELL = 92;
function step() {
  fx.fill(0); fy.fill(0);
  const grid = new Map();
  for (let i = 0; i < N; i++) {
    if (!visible[i]) continue;
    const key = ((px[i] / CELL) | 0) + ',' + ((py[i] / CELL) | 0);
    let arr = grid.get(key);
    if (!arr) { arr = []; grid.set(key, arr); }
    arr.push(i);
  }
  for (const [key, arr] of grid) {
    const [cx, cy] = key.split(',').map(Number);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const other = grid.get((cx + dx) + ',' + (cy + dy));
      if (!other) continue;
      for (const i of arr) for (const j of other) {
        if (j <= i) continue;
        let ddx = px[i] - px[j]; let ddy = py[i] - py[j];
        let d2 = ddx * ddx + ddy * ddy;
        if (d2 > CELL * CELL * 4) continue;
        if (d2 < 1) { ddx = (hash01(String(i)) - 0.5) * 2; ddy = (hash01(String(j)) - 0.5) * 2; d2 = 1; }
        // Nodes from different modules push each other apart harder than siblings do. This
        // is the other half of making enclosure work: without it every territory overlaps
        // every other one and a hull is just another line through the knot.
        let f = 6400 / Math.max(d2, 25);
        if (f > 14) f = 14;
        f *= rootOf[i] === rootOf[j] ? 0.85 : 1.6;
        const d = Math.sqrt(d2);
        const ux = ddx / d; const uy = ddy / d;
        fx[i] += ux * f; fy[i] += uy * f;
        fx[j] -= ux * f; fy[j] -= uy * f;
      }
    }
  }
  // Territory separation: whole modules push each other apart, which is the only force with
  // the reach to keep the map divided into regions you can actually name.
  if (G) {
    gcx.fill(0); gcy.fill(0); gcn.fill(0); gpush.fill(0);
    for (let i = 0; i < N; i++) {
      const g = groupOf[i];
      if (g < 0 || !visible[i]) continue;
      gcx[g] += px[i]; gcy[g] += py[i]; gcn[g]++;
    }
    for (let g = 0; g < G; g++) {
      if (!gcn[g]) continue;
      gcx[g] /= gcn[g]; gcy[g] /= gcn[g];
      gcr[g] = 40 + Math.sqrt(gcn[g]) * 26;
    }
    for (let a = 0; a < G; a++) {
      if (!gcn[a]) continue;
      for (let b = a + 1; b < G; b++) {
        if (!gcn[b]) continue;
        const dx = gcx[a] - gcx[b]; const dy = gcy[a] - gcy[b];
        const d = Math.hypot(dx, dy) || 0.01;
        const want = gcr[a] + gcr[b];
        if (d >= want) continue;
        const f = (want - d) * 0.05;
        const ux = dx / d; const uy = dy / d;
        gpush[a * 2] += ux * f; gpush[a * 2 + 1] += uy * f;
        gpush[b * 2] -= ux * f; gpush[b * 2 + 1] -= uy * f;
      }
    }
    for (let i = 0; i < N; i++) {
      const g = groupOf[i];
      if (g < 0 || !visible[i]) continue;
      fx[i] += gpush[g * 2]; fy[i] += gpush[g * 2 + 1];
    }
  }

  for (const [a, b, rest, k] of springs) {
    if (!visible[a] || !visible[b]) continue;
    const dx = px[b] - px[a]; const dy = py[b] - py[a];
    const d = Math.hypot(dx, dy) || 0.01;
    const f = k * (d - rest);
    const ux = (dx / d) * f; const uy = (dy / d) * f;
    fx[a] += ux; fy[a] += uy; fx[b] -= ux; fy[b] -= uy;
  }
  for (let i = 0; i < N; i++) {
    if (!visible[i] || i === pinned) continue;
    // Light: strong centre gravity fights the territory separation below and collapses the
    // ring of modules back into one pile.
    fx[i] -= px[i] * 0.0014; fy[i] -= py[i] * 0.0014;
    vx[i] = (vx[i] + fx[i] * alpha) * 0.85;
    vy[i] = (vy[i] + fy[i] * alpha) * 0.85;
    const sp = Math.hypot(vx[i], vy[i]);
    if (sp > 12) { vx[i] *= 12 / sp; vy[i] *= 12 / sp; }
    px[i] += vx[i]; py[i] += vy[i];
  }
  alpha *= 0.995;
}

// Flow layout: layered DAG, entrypoints on the left, dependencies flowing right.
const flowX = new Float32Array(N); const flowY = new Float32Array(N);
const layerOf = new Int16Array(N).fill(-1);
const backEdges = new Set();
let layerRows = [];
let layerBlocks = [];
const FLOW_COLW = 232;

function computeFlowLayout() {
  const members = [];
  for (let i = 0; i < N; i++) if (inFlow[i]) members.push(i);
  if (!members.length) return;

  // 1. break cycles with an iterative DFS so layering has a DAG to work on
  const color = new Uint8Array(N);
  const onStack = new Uint8Array(N);
  for (const start of members) {
    if (color[start]) continue;
    const stack = [[start, 0]];
    color[start] = 1; onStack[start] = 1;
    while (stack.length) {
      const frame = stack[stack.length - 1];
      const kids = flowOut[frame[0]];
      if (frame[1] < kids.length) {
        const nx = kids[frame[1]++];
        if (onStack[nx]) { backEdges.add(frame[0] + '>' + nx); continue; }
        if (color[nx]) continue;
        color[nx] = 1; onStack[nx] = 1; stack.push([nx, 0]);
      } else { onStack[frame[0]] = 0; stack.pop(); }
    }
  }
  const fwd = (i) => flowOut[i].filter((j) => !backEdges.has(i + '>' + j));
  const bwd = (i) => flowIn[i].filter((j) => !backEdges.has(j + '>' + i));

  // 2. longest-path layering from roots
  const indeg = new Map(members.map((i) => [i, bwd(i).length]));
  const queue = members.filter((i) => indeg.get(i) === 0);
  for (const i of members) layerOf[i] = 0;
  const order = [];
  for (let qi = 0; qi < queue.length; qi++) {
    const cur = queue[qi];
    order.push(cur);
    for (const nx of fwd(cur)) {
      if (layerOf[nx] < layerOf[cur] + 1) layerOf[nx] = layerOf[cur] + 1;
      indeg.set(nx, indeg.get(nx) - 1);
      if (indeg.get(nx) === 0) queue.push(nx);
    }
  }
  for (const i of members) if (layerOf[i] < 0) layerOf[i] = 0;

  // 3. barycenter ordering, four sweeps
  const maxLayer = Math.max(...members.map((i) => layerOf[i]));
  layerRows = Array.from({ length: maxLayer + 1 }, () => []);
  for (const i of members) layerRows[layerOf[i]].push(i);
  for (const rows of layerRows) rows.sort((a, b) => nodes[a].k.localeCompare(nodes[b].k));
  const pos = new Float32Array(N);
  const reindex = () => layerRows.forEach((rows) => rows.forEach((i, k) => { pos[i] = k; }));
  reindex();
  for (let sweep = 0; sweep < 4; sweep++) {
    const down = sweep % 2 === 0;
    const range = down ? [...layerRows.keys()] : [...layerRows.keys()].reverse();
    for (const L of range) {
      const neighbours = down ? bwd : fwd;
      layerRows[L].sort((a, b) => {
        const ba = bary(a, neighbours, pos); const bb = bary(b, neighbours, pos);
        return ba - bb || nodes[a].k.localeCompare(nodes[b].k);
      });
      reindex();
    }
  }
  // Group each layer into module blocks -- same-module rows were already adjacent, but with
  // nothing drawn around them a run of eight rows from kernel/ looked like eight unrelated
  // ones. Tests get a block of their own: a test file has no importers, so longest-path
  // layering files it under "entry points" beside src/index.ts. 19 of the 46 roots on the
  // reference repo were tests, which makes that column a lie about where the program starts.
  const TESTS = '\u0000tests';
  const blockKey = (i) => (isTestPath(nodes[i].k) ? TESTS : dirOf(nodes[i].k));
  layerBlocks = layerRows.map((rows) => {
    const groups = new Map();
    rows.forEach((i, k) => {
      const m = blockKey(i);
      if (!groups.has(m)) groups.set(m, { key: m, label: m === TESTS ? 'tests' : m, first: k, items: [] });
      groups.get(m).items.push(i);
    });
    return [...groups.values()].sort((a, b) =>
      (a.key === TESTS ? 1 : 0) - (b.key === TESTS ? 1 : 0) || a.first - b.first);
  });

  const ROWH = 24; const BLOCK_GAP = 26;   // room for the block's own label above it
  flowBottom = 0;
  layerBlocks.forEach((blocks, L) => {
    let h = -BLOCK_GAP;
    for (const b of blocks) h += b.items.length * ROWH + BLOCK_GAP;
    let y = -h / 2;
    for (const b of blocks) {
      b.y0 = y - 5;
      b.items.forEach((i, k) => { flowX[i] = L * FLOW_COLW; flowY[i] = y + k * ROWH + ROWH / 2; });
      y += b.items.length * ROWH;
      b.y1 = y + 5;
      y += BLOCK_GAP;
      if (b.y1 > flowBottom) flowBottom = b.y1;
    }
    layerRows[L] = blocks.flatMap((b) => b.items);
  });

  // Pill widths and edge ports. 29 import edges converged on the single centre pixel of
  // server.py, which reads as one thick line rather than 29 dependents; giving every edge its
  // own slot on the pill's edge, ordered by where its far end sits, un-crosses most of them.
  ctx.font = '11px ui-sans-serif, system-ui';
  for (const i of members) pillW[i] = Math.min(200, ctx.measureText(labelOf(i)).width + 18);

  portOutOf = new Float32Array(edges.length);
  portInOf = new Float32Array(edges.length);
  const outs = new Map(); const ins = new Map();
  for (const e of edges) {
    if (!FLOW_TYPES.has(e.type)) continue;
    if (!FLOW_NODE_TYPES.has(nodes[e.a].t) || !FLOW_NODE_TYPES.has(nodes[e.b].t)) continue;
    if (!outs.has(e.a)) outs.set(e.a, []);
    outs.get(e.a).push(e);
    if (!ins.has(e.b)) ins.set(e.b, []);
    ins.get(e.b).push(e);
  }
  for (const [, arr] of outs) {
    arr.sort((p, q) => flowY[p.b] - flowY[q.b]);
    arr.forEach((e, k) => { portOutOf[e.ei] = arr.length === 1 ? 0 : (k / (arr.length - 1)) * 2 - 1; });
  }
  for (const [, arr] of ins) {
    arr.sort((p, q) => flowY[p.a] - flowY[q.a]);
    arr.forEach((e, k) => { portInOf[e.ei] = arr.length === 1 ? 0 : (k / (arr.length - 1)) * 2 - 1; });
  }
}

function bary(i, neighbours, pos) {
